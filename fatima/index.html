<title>MEX-FATIMA - METODEX</title>
<style>
:root{--bg:#eef1f6;--surf:#fff;--surf2:#f5f7fb;--ink:#0b1f3a;--mut:#5a6b80;--line:#e1e7ef;--navy:#0f2742;--navy2:#1b4272;--gold:#c8962e;
--v:#12935a;--a:#c98900;--c:#d13b33;--vbg:#e2f5ea;--abg:#fdf1d4;--cbg:#fde5e3;--blue:#2b6cb0;--blue2:#a9c4e6;--sh:0 1px 2px rgba(15,39,66,.06),0 6px 20px rgba(15,39,66,.07)}
:root[data-theme=dark]{--bg:#08121f;--surf:#0f1e33;--surf2:#14263f;--ink:#eaf0f8;--mut:#93a4ba;--line:#1d3250;--navy:#0a1626;--navy2:#16355f;--gold:#e3b04b;
--v:#34d283;--a:#f2b632;--c:#ff6f64;--vbg:#0f3326;--abg:#3a2d0a;--cbg:#3d1714;--blue:#6aa8f0;--blue2:#2f527f;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#08121f;--surf:#0f1e33;--surf2:#14263f;--ink:#eaf0f8;--mut:#93a4ba;--line:#1d3250;--navy:#0a1626;--navy2:#16355f;--gold:#e3b04b;
--v:#34d283;--a:#f2b632;--c:#ff6f64;--vbg:#0f3326;--abg:#3a2d0a;--cbg:#3d1714;--blue:#6aa8f0;--blue2:#2f527f;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.35;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
/* trava */
#lock{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%)}
.lockbox{background:var(--surf);border-radius:24px;padding:30px 24px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lockbox img.lf{height:56px;margin-bottom:14px}.lockbox h1{font-size:21px;letter-spacing:-.3px}.lockbox p{color:var(--mut);font-size:13px;margin-top:4px}
.lockbox form{display:flex;flex-direction:column;gap:12px;margin:22px 0 8px}
.lockbox input{padding:15px 16px;border:1.5px solid var(--line);border-radius:14px;font-size:17px;background:var(--surf2);color:var(--ink);text-align:center}
.lockbox input:focus{outline:2px solid var(--gold);border-color:transparent}
.btn{background:var(--navy);color:#fff;border-radius:14px;padding:15px;font-weight:700;font-size:16px}
:root[data-theme=dark] .btn,.dk .btn{background:var(--gold);color:#1a1200}
.lockerr{color:var(--c);min-height:20px;font-size:13px}.lockbox img.lm{height:34px;margin-top:16px;border-radius:6px}
/* casca */
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
header.top{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;position:relative;z-index:20;border-radius:0 0 22px 22px;box-shadow:0 6px 24px rgba(8,18,31,.25)}
.hrow{display:flex;align-items:center;gap:10px}
.hrow .lg{background:#fff;border-radius:10px;padding:4px 8px;display:flex}.hrow .lg img{height:28px}
.hrow .tt{flex:1;min-width:0}.hrow .tt b{display:block;font-size:17px;letter-spacing:-.2px}.hrow .tt span{display:block;font-size:11.5px;opacity:.8;line-height:1.25}
.ib{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#fff}
.ib svg{width:20px;height:20px}
main{padding:14px 14px 8px}
.pg>*+*{margin-top:12px}
h2.st{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--mut);font-weight:700;margin:20px 4px 8px}
.card{background:var(--surf);border-radius:20px;padding:16px;box-shadow:var(--sh);border:1px solid var(--line)}
.card h3{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.card h3 small{font-weight:500;color:var(--mut);font-size:12px}
.note{font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.4}
.chip{font-size:11px;border-radius:999px;padding:3px 9px;font-weight:700;display:inline-block;white-space:nowrap}
.chip.v{background:var(--vbg);color:var(--v)}.chip.a{background:var(--abg);color:var(--a)}.chip.c{background:var(--cbg);color:var(--c)}.chip.n{background:var(--surf2);color:var(--mut)}
.t-v{color:var(--v)}.t-a{color:var(--a)}.t-c{color:var(--c)}.t-m{color:var(--mut)}
.seg{display:flex;background:var(--surf2);border-radius:14px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{flex:1;padding:10px 6px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:var(--sh)}
/* hero */
.hero{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
.hero .rt{font-size:12.5px;color:var(--mut)}.hero .big{font-size:27px;font-weight:800;letter-spacing:-.8px;line-height:1.1;margin:2px 0}
.hero .sub{font-size:13px;color:var(--mut);margin-top:2px}.hero .sub b{color:var(--ink)}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mini3>div{background:var(--surf2);border-radius:14px;padding:10px;min-width:0}.mini3 span{font-size:11.5px;color:var(--mut);display:block}.mini3 b{font-size:16px;display:block;margin-top:2px;white-space:nowrap}
/* farol */
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchips .chip{font-size:12.5px;padding:6px 12px}
/* carrossel kpi */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 14px 10px;margin:0 -14px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.kt{flex:0 0 150px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;scroll-snap-align:start;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:var(--sh);text-align:left;position:relative;overflow:hidden;min-height:128px}
.kt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--n,var(--line))}
.kt.v::before{background:var(--v)}.kt.a::before{background:var(--a)}.kt.c::before{background:var(--c)}
.kt .l{font-size:12px;color:var(--mut);font-weight:600}.kt .v1{font-size:23px;font-weight:800;letter-spacing:-.6px;margin:5px 0 2px;white-space:nowrap}
.kt .s{font-size:12px;color:var(--mut);line-height:1.3}.kt .s b{color:var(--ink)}
.kt .d{margin-top:6px;font-size:12px;font-weight:700}
/* alertas */
.al{display:flex;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh);text-align:left;width:100%;position:relative;overflow:hidden}
.al::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.al.c::before{background:var(--c)}.al.a::before{background:var(--a)}.al.v::before{background:var(--v)}
.al .ic{flex:0 0 30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;margin-left:4px}
.al.c .ic{background:var(--cbg);color:var(--c)}.al.a .ic{background:var(--abg);color:var(--a)}.al.v .ic{background:var(--vbg);color:var(--v)}
.al .tx{min-width:0;flex:1}.al .tx b{display:block;font-size:15px;margin-bottom:2px}.al .tx p{font-size:13.5px;color:var(--mut);line-height:1.4}
.al .dec{margin-top:6px;font-size:13px;color:var(--ink);font-weight:600}.al .dec i{font-style:normal;color:var(--gold);margin-right:4px}
.al .go{align-self:center;color:var(--mut)}
/* linhas e barras */
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:0}.row .k{color:var(--mut);min-width:0}.row .vv{font-weight:700;text-align:right;white-space:nowrap}
.row.tot{font-weight:800}.row.tot .k{color:var(--ink)}
.bar{height:10px;border-radius:99px;background:var(--surf2);position:relative;overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;display:block}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55;border-radius:2px}
.sec{padding:11px 0;border-top:1px solid var(--line)}.sec:first-of-type{border-top:0}
.sec .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:7px}.sec .h b{font-size:14.5px}.sec .h span{font-size:12.5px;font-weight:700}
.sec .m{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-top:6px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;background:var(--surf2)}.stack i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;font-size:12px;color:var(--mut)}.leg span{display:inline-flex;align-items:center;gap:5px}.leg em{width:10px;height:10px;border-radius:3px;display:inline-block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surf2);border-radius:14px;padding:11px 12px;min-width:0}.tile>span{font-size:12px;color:var(--mut);display:block}.tile b{font-size:19px;display:block;margin-top:2px;letter-spacing:-.4px;white-space:nowrap}.tile small{font-size:11.5px;color:var(--mut);display:block;margin-top:1px}
.more{display:block;width:100%;margin-top:6px;padding:11px;border-radius:12px;background:var(--surf2);color:var(--blue);font-weight:700;font-size:13.5px}
.tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:600}

.ind{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:14px 14px 12px;box-shadow:var(--sh);position:relative;overflow:hidden;width:100%;text-align:left;display:block}
.ind::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
.ind.v::before{background:var(--v)}.ind.a::before{background:var(--a)}.ind.c::before{background:var(--c)}
.ind .t{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-left:4px}.ind .t b{font-size:13.5px;color:var(--mut);font-weight:700}
.ind .m{display:grid;grid-template-columns:1fr 96px;gap:10px;align-items:end;margin:4px 0 2px 4px}
.ind .v1{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1}.ind .s{font-size:13px;color:var(--mut);margin-top:3px}.ind .s b{color:var(--ink)}
.ind .fr{margin:8px 0 0 4px;font-size:13.5px;font-weight:600}
.chain{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chain>div{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:9px 11px;position:relative}
.chain .g{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;display:flex;align-items:center;gap:6px}.chain .g i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chain .x{font-size:12.5px;color:var(--mut);margin-top:3px;line-height:1.3}
.gb{display:flex;align-items:center;gap:12px}.gb .dot{width:46px;height:46px;border-radius:50%;flex:0 0 46px}
.pill{display:inline-block;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800}
.pill.v{background:var(--vbg);color:var(--v)}.pill.a{background:var(--abg);color:var(--a)}.pill.c{background:var(--cbg);color:var(--c)}.pill.n{background:var(--surf2);color:var(--mut)}
.dec{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:13px 14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.dec::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px}.dec.c::before{background:var(--c)}.dec.a::before{background:var(--a)}
.dec b{display:block;font-size:15.5px;margin:0 0 3px 4px}.dec p{font-size:13.5px;color:var(--mut);margin-left:4px}
.dec .w{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 0 4px;font-size:12.5px;font-weight:700}.dec .w span{color:var(--ink)}.dec .w em{font-style:normal;color:var(--mut);font-weight:600}

:root{--y:#FFC800}
header.top{border-bottom:4px solid var(--y)}
.capa{background:linear-gradient(150deg,#0f2742 0%,#1b4272 100%);color:#fff;border-radius:24px;padding:18px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.capa::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,0,.28),rgba(255,200,0,0) 70%)}
.capa .k{font-size:12px;letter-spacing:.9px;font-weight:800;color:var(--y);text-transform:uppercase}
.capa h1{font-size:22px;line-height:1.2;letter-spacing:-.5px;margin:6px 0 12px;font-weight:800}
.capa .row2{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center}
.capa .cnt{display:flex;flex-direction:column;gap:6px}.capa .cnt span{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}.capa .cnt i{width:12px;height:12px;border-radius:50%;display:inline-block}
.capa .sub{font-size:12.5px;opacity:.8;margin-top:12px;line-height:1.4}
.com{background:var(--surf);border:1px solid var(--line);border-left:6px solid var(--y);border-radius:20px;padding:15px 15px 12px;box-shadow:var(--sh)}
.com .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.com .hd b{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.com h5{font-size:12.5px;font-weight:800;margin:10px 0 3px;color:var(--ink)}.com h5:first-of-type{margin-top:2px}
.com p{font-size:14.5px;line-height:1.5;color:var(--ink);margin:0 0 5px}.com ul{padding-left:18px;margin:0}.com li{font-size:14.5px;line-height:1.5;margin-bottom:4px}
.rg{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:13px 14px 12px;box-shadow:var(--sh);position:relative;overflow:hidden}
.rg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
.rg.v::before{background:var(--v)}.rg.a::before{background:var(--a)}.rg.c::before{background:var(--c)}
.rg .h{display:flex;justify-content:space-between;align-items:center;margin-left:4px}.rg .h b{font-size:13.5px;color:var(--mut);font-weight:700}
.rg .big{font-size:28px;font-weight:800;letter-spacing:-.9px;margin:2px 0 0 4px;line-height:1.15}
.rg .cmp{display:flex;gap:14px;flex-wrap:wrap;margin:5px 0 0 4px;font-size:12.5px;color:var(--mut)}.rg .cmp b{color:var(--ink)}
.d{font-style:normal;font-weight:800;font-size:12px;margin-left:3px}.d.g{color:var(--v)}.d.b{color:var(--c)}.d.n{color:var(--mut)}
.bt{position:relative;height:10px;border-radius:99px;margin:11px 4px 3px 4px;display:flex;overflow:hidden;background:var(--surf2)}
.bt i{height:100%;display:block}.bt .zr{background:var(--c);opacity:.28}.bt .za{background:var(--a);opacity:.35}.bt .zg{background:var(--v);opacity:.32}
.bl{position:relative;height:0;margin:0 4px}.bl .val{position:absolute;top:-17px;width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid var(--surf);transform:translateX(-5px);box-shadow:0 0 0 1px var(--ink)}
.bl .mk{position:absolute;top:-21px;width:2px;height:18px;background:var(--y);box-shadow:0 0 0 1px rgba(0,0,0,.25);transform:translateX(-1px)}
.rg .mt{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:12px 4px 0 4px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.heat div{border-radius:12px;padding:8px 2px;text-align:center;background:var(--surf2);position:relative}
.heat small{display:block;font-size:10.5px;color:var(--mut);font-weight:700;text-transform:uppercase}.heat b{display:block;font-size:14px;margin-top:2px}
.heat .fe{position:absolute;top:2px;right:4px;font-size:9px;font-weight:800;color:var(--y)}
.heat .h-v{background:var(--vbg)}.heat .h-v b{color:var(--v)}.heat .h-a{background:var(--abg)}.heat .h-a b{color:var(--a)}.heat .h-c{background:var(--cbg)}.heat .h-c b{color:var(--c)}
.jg .r{padding:10px 0;border-top:1px solid var(--line)}.jg .r:first-of-type{border-top:0}.jg .r .t{display:flex;justify-content:space-between;gap:8px;font-size:14px}.jg .r .t b{white-space:nowrap}
.jg .bar{margin-top:7px}
.opt{display:flex;gap:8px;margin-top:10px}.opt button{flex:1;padding:14px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--surf2);font-weight:700;font-size:14px}.opt button.on{border-color:var(--y);background:var(--abg);color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th{font-size:11.5px;color:var(--mut);text-align:right;padding:4px 0;font-weight:700}.tbl th:first-child,.tbl td:first-child{text-align:left}.tbl td{padding:8px 0;border-top:1px solid var(--line);text-align:right}.tbl td:first-child{color:var(--mut)}
.inst{display:flex;align-items:center;gap:8px;margin:12px 14px 0;background:var(--y);color:#1a1200;border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:600;box-shadow:var(--sh)}.inst span{flex:1}.inst button{background:#0f2742;color:#fff;border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px}.inst #bInstFechar{background:none;color:#1a1200;font-size:22px;padding:0 6px;line-height:1}
.off{margin:10px 14px 0;background:var(--abg);color:var(--a);border:1px solid var(--a);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:700}

.it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.it:first-of-type{border-top:0}.it b{font-size:14px}.it small{display:block;color:var(--mut);font-size:12px;margin-top:1px}.it .v{font-weight:800;white-space:nowrap;text-align:right;font-size:14px}.it .v small{font-weight:600}
.dchips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}.dchips button{padding:10px 2px;border-radius:14px;background:var(--surf);border:1px solid var(--line);font-weight:800;font-size:13px;color:var(--mut);position:relative}.dchips button small{display:block;font-size:10px;font-weight:600;margin-top:1px}.dchips button.on{background:var(--navy);color:var(--y);border-color:var(--navy)}.dchips button.hoje::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--y)}
.rei{display:flex;align-items:baseline;gap:10px;margin:2px 0 8px}.rei .n{font-size:38px;font-weight:800;letter-spacing:-1.2px;line-height:1}.rei .l{font-size:13px;opacity:.85}
.capa ul{padding-left:18px;margin:10px 0 0}.capa li{font-size:14px;line-height:1.45;margin-bottom:6px;opacity:.95}
.fd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fd>div{background:var(--surf2);border-radius:14px;padding:10px;text-align:center}.fd small{display:block;font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase}.fd b{display:block;font-size:16px;margin-top:2px}.fd em{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:2px}.fd .fe{color:var(--c);font-weight:800}

/* ---------- METAS > ANO ---------- */

  const vals = gr.reduce((a, z) => a.concat([z.r, z.p]), []).filter(v => v != null), top = Math.max.apply(null, vals.concat([1])), bot = Math.min.apply(null, vals.concat([-1])), pad = (top - bot) * 0.12;

  for (let k = 1; k <= 12; k++) g += '<text x="' + X(A.ano + '-' + String(k).padStart(2, '0') + '-15') + '" y="' + (H - 7) + '" font-size="9" text-anchor="middle" fill="var(--mut)">' + MTM[k] + '</text>';
  g += '<path d="' + path(z => z.r) + ' L' + X(ult.e).toFixed(1) + ' ' + Y(0).toFixed(1) + ' L' + X(gr[0].e).toFixed(1) + ' ' + Y(0).toFixed(1) + 'Z" fill="var(--blue)" opacity=".13"/><path d="' + path(z => z.p) + '" fill="none" stroke="var(--blue)" stroke-width="2.8" stroke-dasharray="1 5" stroke-linecap="round"/><path d="' + path(z => z.r) + '" fill="none" stroke="var(--blue)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>';
  g += '<circle cx="' + X(ult.e) + '" cy="' + Y(ult.r) + '" r="4.5" fill="var(--blue)"/><text x="' + (X(ult.e) - 4) + '" y="' + (Y(ult.r) - 9) + '" font-size="11" font-weight="800" text-anchor="end" fill="var(--blue)">' + (ult.r >= 0 ? '+' : '-') + nf(Math.abs(ult.r) / 1e6, 2) + ' mi hoje</text><circle cx="' + X(A.ano + '-12-31') + '" cy="' + Y(fimg.p) + '" r="5" fill="var(--surf)" stroke="var(--blue)" stroke-width="2.4"/><text x="' + (W - pr) + '" y="' + (Y(fimg.p) - 10) + '" font-size="11" font-weight="800" text-anchor="end" fill="var(--blue)">' + (fimg.p >= 0 ? '+' : '-') + nf(Math.abs(fimg.p) / 1e6, 2) + ' mi</text></svg>';

  const m3 = A.meses.filter(z => !z.parcial).slice(-3), ritAt = m3.length ? m3.reduce((a, z) => a + z.real, 0) / m3.length : 0, ritNec = mRest ? A.falta / mRest : 0;
  const hero = '<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font-size:12px;color:var(--mut);font-weight:700">PREVISAO ' + A.ano + ' - FATURAMENTO</div><div style="font-size:32px;font-weight:800;letter-spacing:-1px">' + mtMi(A.prev) + '</div></div><span class="qbadge" style="background:' + MTC[mtFz(pPrev)] + '">' + nf(pPrev * 100, 1) + '% da meta</span></div>' +

/* ---------- comparativo de anos (Metas > Ano) ---------- */
function mtAnos() {
  const A = MT().anos; if (!A) return '';
  const W = 390, H = 190, pl = 30, pr = 10, pt = 14, pb = 22, vals = A.reduce((a, y) => a.concat(y.v), []).filter(v => v != null), mx = Math.max.apply(null, vals) * 1.05, mn = Math.min.apply(null, vals) * 0.9;
  const X = i => pl + i * (W - pl - pr) / 11, Y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  const cs = ['var(--mut)', 'var(--blue)', 'var(--gold)'];
  let g = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%">';
  [2, 2.5, 3].forEach(v => { const y = Y(v * 1e6); if (y > pt && y < H - pb) g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)"/><text x="' + (pl - 4) + '" y="' + (y + 3) + '" font-size="9" text-anchor="end" fill="var(--mut)">' + nf(v, 1) + '</text>'; });
  for (let k = 0; k < 12; k++) g += '<text x="' + X(k) + '" y="' + (H - 6) + '" font-size="9" text-anchor="middle" fill="var(--mut)">' + MTM[k + 1] + '</text>';
  A.forEach((y, j) => { let d = ''; y.v.forEach((v, k) => { if (v != null) d += (d ? 'L' : 'M') + X(k).toFixed(1) + ' ' + Y(v).toFixed(1); }); g += '<path d="' + d + '" fill="none" stroke="' + cs[j] + '" stroke-width="' + (j === 2 ? 3.4 : 2.2) + '"' + (j === 0 ? ' stroke-dasharray="4 3"' : '') + ' stroke-linecap="round" stroke-linejoin="round"/>'; });
  g += '</svg><div class="leg">' + A.map((y, j) => '<span><em style="background:' + cs[j] + '"></em>' + y.a + '</span>').join('') + '</div>';
  const fech = A[2].v.filter(v => v != null).length, s26 = A[2].v.slice(0, fech).reduce((a, b) => a + b, 0), s25 = A[1].v.slice(0, fech).reduce((a, b) => a + b, 0);
  return '<h2 class="st">Comparativo de 3 anos</h2><div class="card"><h3>Faturamento por mes <small>R$ mi, com repasse</small></h3>' + g + '<p class="nt">Meses fechados. ' + A[2].a + ' contra ' + A[1].a + ' nos mesmos ' + fech + ' meses: <b class="' + (s26 >= s25 ? 't-v' : 't-c') + '">' + mtSg(s26 / s25 - 1) + '</b>.</p></div>';
}

function linhaMeta(rot, vals, meta, fmt, c) {
  const W = 340, H = 150, pl = 10, pr = 10, pt = 24, pb = 22;
  const xs = vals.filter(ok).concat(ok(meta) ? [meta] : []); if (!xs.length) return '';
  let mx = Math.max(...xs), mn = Math.min(...xs); const pad = ((mx - mn) || Math.abs(mx) * 0.1 || 1) * 0.3; mx += pad; mn -= pad;
  const X = i => pl + i * (W - pl - pr) / Math.max(1, vals.length - 1), Y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  let g = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  if (ok(meta)) g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(meta).toFixed(1) + '" y2="' + Y(meta).toFixed(1) + '" stroke="var(--y)" stroke-width="2" stroke-dasharray="5 5"/><text x="' + pl + '" y="' + (Y(meta) - 5).toFixed(1) + '" font-size="11" fill="var(--mut)">meta ' + fmt(meta) + '</text>';
  let d = ''; vals.forEach((v, i) => { if (ok(v)) d += (d ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); });
  g += '<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>';
  vals.forEach((v, i) => { if (ok(v)) g += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="' + (i === vals.length - 1 ? 5 : 3) + '" fill="' + c + '"/>'; });
  const li = vals.length - 1; if (ok(vals[li])) g += '<text x="' + X(li).toFixed(1) + '" y="' + (Y(vals[li]) - 10).toFixed(1) + '" font-size="12" font-weight="800" text-anchor="end" fill="var(--ink)">' + fmt(vals[li]) + '</text>';
  rot.forEach((r, i) => { if ((vals.length - 1 - i) % 2 === 0) g += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 6) + '" font-size="11" text-anchor="middle" fill="var(--mut)">' + esc(r) + '</text>'; });
  return g + '</svg>';
}

function calMes() {

  return '<div class="card"><h3>Calendario do mes <small>efeito de cada dia sobre a venda</small></h3>' + gr + f.map(z => '<div class="row"><span class="k">' + z[0] + ' <span class="t-m">' + z[2] + '</span></span><span class="vv ' + (z[1] >= 0 ? 't-v' : 't-c') + '">' + sg(z[1]) + '</span></div>').join('') + ajuste + '<p class="nt">A meta de cada dia usa o dia da semana e o dia do mes (media de 2024 a 2026); o total do mes nao muda.</p></div>';

function agFormasSitef() {
  const F = M.ag.formas; if (!F) return '';
  const RC = !!M.ag.receb;
  const c = F.cur, a = F.ant, R = F.rotulo, O = F.ordem;
  const cor = {debito: 'var(--blue)', credito: '#6aa8f0', pix: 'var(--v)', voucher: 'var(--y)', outros: 'var(--mut)'};
  const base = (c.completa && c.varejo) ? c.varejo : (c.total || 1);
  const partes = O.map(k => ({n: R[k].split(' (')[0], v: c.por[k].v, c: cor[k], l: PCT(c.por[k].v / base, 0)}));
  if (!RC && c.demais != null) partes.push({n: 'Dinheiro, prazo e cheque (est.)', v: c.demais, c: '#b8c2cf', l: PCT(c.demais / base, 0)});
  const tiles = '<div class="grid2">' + (RC ? tile('SITEF x recebimento', ok(M.ag.receb.cur.dif_sitef) ? VAR(M.ag.receb.cur.dif_sitef) : '-', BRL(c.total) + ' no SITEF contra ' + BRL(M.ag.receb.cur.elet) + ' no recebimento') : tile('Passou no SITEF', c.pct_tef != null ? PCT(c.pct_tef, 0) : '-', BRL(c.total) + (c.varejo ? ' de ' + BRL(c.varejo) + ' do varejo' : ''))) + tile('Ticket medio (cartao e PIX)', 'R$ ' + nf(c.ticket, 0), NUM(c.n) + ' transacoes') + tile('Sem contato', PCT(c.sem_contato, 0), 'contactless e QR Code') + tile('Recusas', BRL(c.recusa_v), PCT(c.recusa_pct, 1) + ' do tentado - ' + c.recusa_n + ' tentativas') + '</div>';
  const linhas = O.map(k => { const v = c.por[k].v, v0 = a.por[k].v; const d = v0 ? v / v0 - 1 : null; return '<div class="it"><span><b>' + esc(R[k]) + '</b><small>' + PCT(v / base, 0) + ' do varejo - ' + NUM(c.por[k].n) + ' transacoes' + (c.por[k].n ? ' - ticket R$ ' + nf(v / c.por[k].n, 0) : '') + '</small></span><span class="v">' + BRL(v) + '<small class="' + (ok(d) ? (d >= 0 ? 't-v' : 't-c') : '') + '">' + (ok(d) ? VAR(d) + ' vs sem. ant.' : '') + '</small></span></div>'; }).join('') +
    (!RC && c.demais != null ? '<div class="it"><span><b>Dinheiro, prazo e cheque</b><small>estimativa: venda do varejo menos o que passou no SITEF</small></span><span class="v">' + BRL(c.demais) + '<small>' + PCT(c.demais / base, 0) + ' do varejo</small></span></div>' : '');
  const sem = F.serie.map(x => { const b = x.varejo || 1; const cart = x.por.debito.v + x.por.credito.v; return '<div class="row"><span class="k">' + DM(x.ini) + (x.completa ? '' : ' <span class="t-a">(incompleta)</span>') + '</span><span class="vv">' + (x.completa ? 'cartao ' + PCT(cart / b, 0) + ' - PIX ' + PCT(x.por.pix.v / b, 0) + ' - demais ' + PCT(x.demais / b, 0) : BRL(x.total) + ' capturados') + '</span></div>'; }).join('');
  const mes = F.meses.map(m => { const ct = m.contabil; const comp = !m.parcial && !m.dias_sem_dado && ct && ct.cartao ? m.total / ct.cartao - 1 : null;
    return '<div class="it"><span><b>' + ML(m.m) + (m.parcial ? ' (em andamento)' : '') + (m.dias_sem_dado ? ' <span class="t-a">- ' + m.dias_sem_dado + ' dias sem arquivo</span>' : '') + '</b><small>PIX ' + PCT(m.pix_pct, 0) + ' - cartoes ' + PCT(m.cartao_pct, 0) + (ct ? ' - contabil: a vista ' + BRL(ct.vista) + ', prazo ' + BRL(ct.prazo) + ', cheque ' + BRL(ct.cheque) : '') + '</small></span><span class="v">' + BRL(m.total) + (ok(comp) ? '<small>' + (comp >= 0 ? '+' : '') + nf(comp * 100, 1) + '% vs contabil</small>' : '') + '</span></div>'; }).join('');
  const redes = F.rede.map(z => '<div class="it"><b>' + esc(z[0]) + '</b><span class="v">' + BRL(z[1]) + '<small>' + PCT(z[1] / (c.total || 1), 0) + '</small></span></div>').join('');
  const modos = F.modo.map(z => '<div class="it"><b>' + esc(z[0]) + '</b><span class="v">' + BRL(z[1]) + '<small>' + PCT(z[1] / (c.total || 1), 0) + '</small></span></div>').join('');
  return '<div class="card"><h3>Venda por forma de pagamento <small>' + quando(c.ini, c.fim) + '</small></h3>' + pilha(partes) + '<div style="height:10px"></div>' + tiles + '<h3 style="margin-top:12px">Por forma</h3>' + linhas +

}

function agFormas() {
  const Rc = M.ag.receb;
  if (!Rc) return agFormasSitef();
  const c = Rc.cur, a = Rc.ant, p = c.por, pa = a.por, T = c.total || 1;
  const grp = {din: p.dinheiro, car: p.cartao, pix: p.pix, pra: p.prazo, out: p.carteira + p.cheque + p.outros};
  const pilhaR = pilha([{n: 'Dinheiro', v: grp.din, c: '#3aa66a', l: PCT(grp.din / T, 0)}, {n: 'Cartao', v: grp.car, c: 'var(--blue)', l: PCT(grp.car / T, 0)}, {n: 'PIX', v: grp.pix, c: '#2aa89f', l: PCT(grp.pix / T, 0)}, {n: 'A prazo', v: grp.pra, c: 'var(--y)', l: PCT(grp.pra / T, 0)}, {n: 'Outros', v: grp.out, c: '#b8c2cf', l: PCT(grp.out / T, 0)}]);
  const leg = '<div class="leg"><span><em style="background:#3aa66a"></em>Dinheiro</span><span><em style="background:var(--blue)"></em>Cartao</span><span><em style="background:#2aa89f"></em>PIX</span><span><em style="background:var(--y)"></em>A prazo</span><span><em style="background:#b8c2cf"></em>Outros</span></div>';
  const T0 = a.total || 1, dl = (v, v0) => ok(v0) ? '<span class="t-m">' + (Math.abs(v / T - v0 / T0) < 0.0005 ? '' : v / T - v0 / T0 > 0 ? '+' : '') + nf(Math.abs(v / T - v0 / T0) < 0.0005 ? 0 : (v / T - v0 / T0) * 100, 1) + ' p.p.</span> vs sem. ant.' : '';
  const fc = !c.completa ? ['a', 'semana incompleta'] : Math.abs(c.dif) <= 0.005 ? ['v', 'fecha com o PDV (' + VAR(c.dif) + ')'] : Math.abs(c.dif) <= 0.015 ? ['a', 'diferenca de ' + VAR(c.dif) + ' para o PDV'] : ['c', 'nao fecha com o PDV (' + VAR(c.dif) + ')'];
  const tiles = '<div class="grid2">' + tile('Dinheiro', PCT(grp.din / T, 0), BRL(grp.din) + ' - ' + dl(grp.din, pa.dinheiro)) + tile('Cartao', PCT(grp.car / T, 0), BRL(grp.car) + ' - ' + dl(grp.car, pa.cartao)) + tile('PIX', PCT(grp.pix / T, 0), BRL(grp.pix) + ' - ' + dl(grp.pix, pa.pix)) + tile('A prazo', PCT(grp.pra / T, 0), BRL(grp.pra) + ' - ' + dl(grp.pra, pa.prazo)) + '</div>';
  const main = '<div class="card"><h3>Como a venda foi recebida <small>' + quando(c.ini, c.fim) + '</small> <span class="pill ' + fc[0] + '">' + fc[1] + '</span></h3>' + pilhaR + '<div style="height:10px"></div>' + tiles +
    '<p class="nt">Total recebido ' + BRL(c.total) + ' (varejo, atacado e repasse). Dinheiro: controle de caixa e sangria. Cartao e PIX: custo e prazo de recebimento. A prazo: risco de credito e capital de giro (ver Caixa).</p></div>';
  const sr = Rc.serie.filter(x => x.completa), rot = sr.map(x => DM(x.ini)), sh = k => sr.map(x => x.total ? x.por[k] / x.total : null);
  const tend = '<div class="card"><h3>Tendencia das ultimas ' + sr.length + ' semanas <small>% do recebido</small></h3>' + barras(rot, [{nome: 'Dinheiro', tipo: 'linha', v: sh('dinheiro'), cor: '#3aa66a'}, {nome: 'Cartao', tipo: 'linha', v: sh('cartao'), cor: 'var(--blue)'}, {nome: 'PIX', tipo: 'linha', v: sh('pix'), cor: '#2aa89f'}, {nome: 'A prazo', tipo: 'linha', v: sh('prazo'), cor: 'var(--y)'}], {h: 170, fmt: z => PCT(z, 0)}) + '</div>';
  return main + tend + fold('Detalhe do cartao, PIX e voucher (SITEF)', '<div class="pg">' + agFormasSitef() + '</div>');
}

function agSeg() {
  const a = M.ag, v = M.venda, m = M.margem, x = X(), p = x.ponte, s = a.seg;
  const kp = '<div class="card"><h3>Placar da semana</h3><div class="grid2">' + tile('Venda com repasse', BRL(v.val), ptxt(v.pct) + ' da meta') + tile('Margem do varejo', PCT(m.val, 1), 'meta ' + PCT(m.meta, 1)) + tile('Mes ate hoje', ptxt(v.mes.pct), 'projecao ' + BRL(v.mes.proj)) + tile('Ano ate hoje', ptxt(v.ano.pct), 'da meta proporcional') + '</div></div>';
  let pt = '';
  if (p) {
    const it = (n, val) => '<div class="row"><span class="k">' + n + '</span><span class="vv ' + (val < 0 ? 't-c' : 't-v') + '">' + (val >= 0 ? '+' : '') + nf(val * 100, 1) + ' p.p.</span></div>';
    pt = '<div class="card"><h3>Por que a margem mudou <small>vs semana anterior</small></h3><div class="grid2">' + tile('Semana anterior', PCT(p.ant, 1), 'varejo') + tile('Esta semana', PCT(p.cur, 1), (p.total >= 0 ? '+' : '') + nf(p.total * 100, 1) + ' p.p.') + '</div><div style="height:6px"></div>' +
      it('Mais venda em promocao (' + PCT(p.sp_ant, 0) + ' para ' + PCT(p.sp, 0) + ')', p.mix) + it('Margem dentro da promocao (' + PCT(p.mp_ant, 1) + ' para ' + PCT(p.mp, 1) + ')', p.tx_promo) + it('Margem fora da promocao (' + PCT(p.mn_ant, 1) + ' para ' + PCT(p.mn, 1) + ')', p.tx_normal) + '</div>';
  }
  const pr = '<div class="card"><h3>Promocoes e preco</h3><div class="grid2">' + tile('Abaixo do custo', s.promo.n_custo + ' produtos', 'vendidos em promocao') + tile('Quase permanentes', s.promo.n_perm, s.promo.n_pos + ' com queda depois') + '</div>' +
    (s.promo.custo_nomes.length ? '<h3 style="margin-top:12px">Exemplos abaixo do custo</h3>' + s.promo.custo_nomes.map(n => '<div class="it"><b>' + esc(n) + '</b></div>').join('') : '') + '</div>';
  const vb = '<div class="card"><h3>Verbas de fornecedores a receber <small>' + BRL(s.verbas.total) + '</small></h3>' + itens(s.verbas.top, z => '<div class="it"><b>' + esc(z[0]) + '</b><span class="v">' + BRL(z[1]) + '</span></div>') + '<p class="nt">A maior parte esta concentrada em um unico fornecedor: vale confirmar a origem e o prazo de recebimento.</p></div>';
  const at = '<div class="card"><h3>Atacado no mes <small>' + BRL(s.atacado.total) + ' em ' + s.atacado.n + ' clientes</small></h3>' + itens(s.atacado.clientes, z => '<div class="it"><b>' + esc(z[0]) + '</b><span class="v">' + BRL(z[1]) + '</span></div>') + '</div>';
  const cc = '<div class="card"><h3>Concorrentes <span class="pill n">aguardando fonte</span></h3><p class="nt" style="margin-top:0">' + esc(s.concorrentes.nota) + '</p></div>';
  return agCapa('seg') + agDec(M.ag.ed.seg.decisoes) + kp + '<div class="pg" style="margin-top:12px">' + gVenda() + gMargem() + '</div><div style="height:12px"></div>' + fold('O que o consultor diz', comentario(x.com.semana)) + '<h2 class="st">Venda por forma de pagamento</h2><div class="pg">' + agFormas() + '</div><h2 class="st">Margem e preco</h2><div class="pg">' + pt + pr + vb + at + cc + '</div>';
}
function agTer() {
  const t = M.ag.ter, r = t.reposicao, e = t.estoque, pd = t.pedidos, pq = t.perdas, f = t.fds;
  const comprar = '<div class="card"><h3>Comprar: A e B sem pedido <small>' + r.n_comprar + ' itens</small></h3>' + itens(r.comprar, z => '<div class="it"><span><b>' + esc(z[0]) + '</b><small>' + esc(z[1]) + ' - ' + z[4] + ' - vende ' + BRL(z[2]) + '/dia - cobre ' + nf(z[3], 1) + ' dias</small></span><span class="v">' + BRL(z[5]) + '<small>a repor</small></span></div>') + '<p class="nt">' + esc(r.nota) + ' Alvo: ' + r.dias_alvo + ' dias.</p></div>';
  const cobrar = '<div class="card"><h3>Cobrar: pedido atrasado <small>' + r.n_cobrar + ' itens</small></h3>' + itens(r.cobrar, z => '<div class="it"><span><b>' + esc(z[0]) + '</b><small>' + esc(z[1]) + ' - ' + z[4] + ' - cobre ' + nf(z[3], 1) + ' dias</small></span><span class="v">' + BRL(z[2]) + '<small>vende/dia</small></span></div>') + '</div>';
  const gond = '<div class="card"><h3>Repor da area: gondola <small>' + r.n_gondola + ' itens</small></h3>' + itens(r.gondola, z => '<div class="it"><span><b>' + esc(z[0]) + '</b><small>' + esc(z[1]) + ' - ' + z[2] + ' dias sem venda</small></span>' + (ok(z[3]) ? '<span class="v">' + BRL(z[3]) + '<small>perdido/dia</small></span>' : '') + '</div>') +
    '<div class="grid2" style="margin-top:10px">' + tile('Sem saldo no estoque', r.n_sem_saldo, 'comprar') + tile('Sem controle de saldo', r.n_sem_ctrl, 'conferir fisicamente') + '</div>' + (ok(r.venda_perdida_dia) ? '<p class="nt">Venda perdida estimada por ruptura: ' + BRL(r.venda_perdida_dia) + ' por dia.</p>' : '') + '</div>';
  const mx = pd.forn.length ? pd.forn[0][1] || 1 : 1;
  const ped = '<div class="card"><h3>Pedidos de compra <span class="pill ' + (pd.f || 'n') + '">' + (pd.f ? FN[pd.f] : 'sem farol') + '</span>' + (pd.base_confirmar ? ' <span class="pill a">base a confirmar</span>' : '') + '</h3><div class="grid2">' + tile('Em aberto', BRL(pd.valor), '') + tile('Vencido', BRL(pd.vencido), ptxt(pd.pct) + ' da carteira') + '</div><div style="height:10px"></div>' + pilha([{n: 'Vencido', v: pd.vencido, c: 'var(--c)', l: BRL(pd.vencido)}, {n: 'Sem data', v: pd.sem_data, c: 'var(--a)', l: BRL(pd.sem_data)}, {n: 'No prazo', v: Math.max(0, pd.valor - pd.vencido - pd.sem_data), c: 'var(--v)', l: BRL(Math.max(0, pd.valor - pd.vencido - pd.sem_data))}]) + linha('Itens vencidos', NUM(pd.itens)) + linha('Sem data de entrega', BRL(pd.sem_data)) +
    '<h3 style="margin-top:12px">Fornecedores com mais atraso</h3>' + pd.forn.map(z => '<div class="sec"><div class="h"><b>' + esc(z[0]) + '</b><span class="t-c">' + BRL(z[1]) + '</span></div><div class="bar"><i style="width:' + (z[1] / mx * 100) + '%;background:var(--c)"></i></div></div>').join('') + '</div>';
  const mxs = e.sec.length ? e.sec[0][1] || 1 : 1;
  const est = '<div class="card"><h3>Estoque <small>posicao de ' + DM(e.data) + '</small></h3><div class="grid2">' + tile('Cobertura', NUM(e.cob, 1) + ' dias', 'meta ' + NUM(e.meta, 1) + ' dias') + tile('Acima do ideal', BRL(e.excesso), e.n_excesso + ' produtos') + '</div>' +
    '<h3 style="margin-top:12px">Onde esta o excesso</h3>' + e.sec.map(z => '<div class="sec"><div class="h"><b>' + esc(z[0]) + '</b><span>' + BRL(z[1]) + '</span></div><div class="bar"><i style="width:' + (z[1] / mxs * 100) + '%;background:var(--a)"></i></div></div>').join('') +
    '<h3 style="margin-top:12px">Maiores excessos por produto</h3>' + itens(e.top, z => '<div class="it"><span><b>' + esc(z[0]) + '</b><small>' + esc(z[1]) + ' - cobre ' + nf(z[4], 0) + ' dias</small></span><span class="v">' + BRL(z[3]) + '<small>acima do ideal</small></span></div>') + '</div>';
  const per = '<div class="card"><h3>Perdas <small>quebra ' + PCT(pq.pct_sem, 2) + ' (meta ' + PCT(pq.meta, 1) + ')</small></h3><span class="pill n">em implantacao</span><div style="height:8px"></div>' + itens(pq.tipos, z => '<div class="it"><b>' + esc(z[0]) + '</b><span class="v">' + BRL(z[1]) + '<small>no mes ' + BRL(z[2]) + '</small></span></div>') +
    '<h3 style="margin-top:12px">Setores com mais perda na semana</h3>' + itens(pq.setores, z => '<div class="it"><b>' + esc(z[0]) + '</b><span class="v">' + BRL(z[1]) + '</span></div>') + '<p class="nt">O lancamento de perdas ainda esta incompleto: o valor real tende a ser maior.</p></div>';
  const DN = ['seg', 'ter', 'qua', 'qui', 'sex', 'sab', 'dom'];
  const fds = '<div class="card"><h3>Fim de semana <small>' + DM(f.dias[0].d) + ' a ' + DM(f.dias[2].d) + '</small></h3><div class="fd">' + f.dias.map(d => '<div><small>' + DN[d.dow] + ' ' + DM(d.d) + '</small><b>' + BRL(d.meta) + '</b><em>media 4 sem. ' + BRL(d.media4) + '</em>' + (d.fer ? '<em class="fe">' + esc(d.fer) + '</em>' : '') + '</div>').join('') + '</div><p class="nt">Meta de venda de cada dia contra a media dos mesmos dias nas 4 ultimas semanas.</p>';
  const grafH = k => { const h = f.horas[k] || []; return h.length ? barras(h.map(z => z[0]), [{nome: 'Clientes por hora', v: h.map(z => z[1]), cor: 'var(--blue)'}], {h: 150, fmt: z => NUM(z)}) : ''; };
  const horas = '<h3 style="margin-top:12px">Horas de pico - sexta <small>clientes por hora</small></h3>' + grafH('4') + '<h3 style="margin-top:6px">Horas de pico - sabado</h3>' + grafH('5') + '<p class="nt">Media dos ultimos meses fechados. Escala: ' + esc(f.escala) + '.</p></div>';
  return agCapa('ter') + agDec(M.ag.ed.ter.decisoes) + '<h2 class="st">Ruptura</h2><div class="pg">' + gRuptura() + '</div><h2 class="st">Sugestao de reposicao</h2><div class="pg">' + comprar + cobrar + gond + '</div><h2 class="st">Abastecimento e estoque</h2><div class="pg">' + ped + est + '</div><h2 class="st">Operacao, perdas e fim de semana</h2><div class="pg">' + per + fds + horas + '</div>';
}

/* ================= FECHAMENTO DO ANO POR FORMA DE PAGAMENTO ================= */
function agFechamento() {
  const Fc = M.ag.fechamento; if (!Fc) return '';
  const t = Fc.total;
  const pp = v => ok(v) ? (v >= 0 ? '+' : '') + nf(v * 100, 2) + '%' : '-';
  const fx = (v, lim) => ok(v) ? (Math.abs(v) <= lim ? 't-v' : Math.abs(v) <= lim * 3 ? 't-a' : 't-c') : '';
  const resumo = '<div class="card"><h3>Fechamento de ' + Fc.ano + ' <small>' + t.n + ' meses fechados</small></h3><div class="grid2">' +
    tile('Formas x venda do PDV', '<span class="' + fx(t.dif_formas_pct, 0.002) + '">' + pp(t.dif_formas_pct) + '</span>', 'soma ' + BRL(t.soma) + ' contra ' + BRL(t.venda) + ' (dif. ' + BRLf(t.dif_formas) + ')') +
    (ok(t.dif_r_pdv_pct) ? tile('Recebimento x venda do PDV', '<span class="' + fx(t.dif_r_pdv_pct, 0.002) + '">' + pp(t.dif_r_pdv_pct) + '</span>', 'soma ' + BRL(t.r_total) + ' (dif. ' + BRLf(t.dif_r_pdv) + ')') : '') + tile('SITEF x cartao contabil', '<span class="' + fx(t.dif_tef_pct, 0.01) + '">' + pp(t.dif_tef_pct) + '</span>', BRL(t.tef) + ' contra ' + BRL(t.cartao) + ' (dif. ' + BRLf(t.dif_tef) + ')') + '</div><div style="height:6px"></div>' +
    linha('A vista (dinheiro)', BRL(t.vista) + ' <span class="t-m">(' + PCT(t.vista / t.venda, 0) + ')</span>') + linha('Cartao, PIX e voucher', BRL(t.cartao) + ' <span class="t-m">(' + PCT(t.cartao / t.venda, 0) + ')</span>') + linha('Prazo (duplicatas e crediario)', BRL(t.prazo) + ' <span class="t-m">(' + PCT(t.prazo / t.venda, 0) + ')</span>') + linha('Cheques', BRL(t.cheque) + ' <span class="t-m">(' + PCT(t.cheque / t.venda, 1) + ')</span>') + linha('PIX (dentro do cartao)', BRL(t.pix) + ' <span class="t-m">(' + PCT(t.pix / t.cartao, 0) + ' do cartao)</span>') + '</div>';
  const meses = '<div class="card"><h3>Mes a mes</h3>' + Fc.meses.map(m => '<div class="it"><span><b>' + ML(m.m) + (m.status !== 'Fechado' ? ' <span class="t-a">(previa)</span>' : '') + '</b><small>a vista ' + BRL(m.vista) + ' - prazo ' + BRL(m.prazo) + ' - cheque ' + BRL(m.cheque) + ' - cartao ' + BRL(m.cartao) + '</small><small>formas x venda <b class="' + fx(m.dif_formas_pct, 0.002) + '">' + pp(m.dif_formas_pct) + '</b> (' + BRLf(m.dif_formas) + ') - SITEF x cartao <b class="' + fx(m.dif_tef_pct, 0.01) + '">' + pp(m.dif_tef_pct) + '</b> (' + BRLf(m.dif_tef) + ')' + (m.dias_sem_sitef ? ' - <span class="t-a">' + m.dias_sem_sitef + ' dia sem arquivo do SITEF</span>' : '') + '</small></span><span class="v">' + BRL(m.venda) + '<small>venda do PDV</small></span></div>').join('') +
    '<p class="nt">Verde: diferenca ate 0,2% (formas) ou 1% (SITEF). Amarelo e vermelho: acima disso. A venda do PDV inclui varejo, atacado e repasse.</p></div>';
  const Rr = M.ag.receb, dd = Rr ? Rr.dias_dif : [];
  const dtxt = dd.length ? ' Maiores diferencas: ' + dd.slice(0, 3).map(z => DM(z[0]) + ' (' + (z[3] >= 0 ? '+' : '') + BRLf(z[3]) + ')').join(', ') + '.' : '';
  const L = ok(t.r_total) ? [
    ['Recebimento por forma x venda do PDV', Rr && Rr.n_dias_dif / Rr.n_dias_ano <= 0.05 ? 'fecha' : 'confere', Rr && Rr.n_dias_dif / Rr.n_dias_ano <= 0.05 ? 'v' : 'a', 'Diferenca de ' + BRLf(t.dif_r_pdv) + ' (' + pp(t.dif_r_pdv_pct) + ') nos meses fechados.' + (Rr ? ' ' + (Rr.n_dias_ano - Rr.n_dias_dif) + ' de ' + Rr.n_dias_ano + ' dias fecham (diferenca ate R$ 100).' : '') + dtxt + ' Notas de saida a prazo sem venda no PDV explicam as maiores.'],
    ['Dinheiro (a vista)', 'fecha', 'v', 'O recebimento diario em dinheiro confere com o a vista contabil (diferenca de ' + BRLf(t.dif_r_dinheiro) + ' no ano). O caixa fisico (sangria e quebra de caixa) segue fora desta base.'],
    ['Cartao, PIX e carteira x contabilidade', 'fecha', 'v', 'Recebimento ' + BRL(t.r_cartao) + ' contra cartao contabil ' + BRL(t.cartao) + ' (diferenca de ' + BRLf(t.dif_r_cartao) + '). O cartao POS vem junto, na forma Cartao.'],
    ['Cartao (TEF) x contabilidade', 'fecha', 'v', 'SITEF fica ' + PCT(Math.abs(t.dif_tef_pct), 1) + ' abaixo do cartao contabil (' + BRL(Math.abs(t.dif_tef)) + ' em ' + t.n + ' meses): transacoes fora do TEF e defasagem de datas.'],
    ['Duplicata e prazo', 'fecha o valor', 'a', 'Valor a prazo do recebimento: ' + BRL(t.r_prazo) + ' contra ' + BRL(t.prazo) + ' na contabilidade (diferenca de ' + BRLf(t.dif_r_prazo) + '). Falta so a baixa: o arquivo de titulos a receber traz apenas os em aberto; para saber o que foi pago e a inadimplencia, exportar tambem os baixados, com data de emissao.'],
    ['Cheques', 'fecha', 'v', 'Recebimento de cheques ' + BRL(t.r_cheque) + ' contra ' + BRL(t.cheque) + ' na contabilidade.']
  ] : [
    ['Total das formas x venda do PDV', 'fecha', 'v', 'Diferenca de ' + BRLf(t.dif_formas) + ' (' + pp(t.dif_formas_pct) + ') em ' + t.n + ' meses.'],
    ['Cartao (TEF) x contabilidade', 'fecha', 'v', 'SITEF fica ' + PCT(Math.abs(t.dif_tef_pct), 1) + ' abaixo do cartao contabil (' + BRL(Math.abs(t.dif_tef)) + ' em ' + t.n + ' meses).'],
    ['Dinheiro, prazo e cheque', 'so total mensal', 'a', 'Somente o total mensal da contabilidade, sem conferencia independente.']
  ];
  const lac = '<div class="card"><h3>O que fecha e o que falta</h3>' + L.map(z => '<div class="it"><span><b>' + z[0] + '</b><small>' + esc(z[3]) + '</small></span><span class="v"><span class="pill ' + z[2] + '">' + z[1] + '</span></span></div>').join('') + '</div>';
  return resumo + meses + lac;
}

function agQui() {
  const q = M.ag.qui, x = X();
  const rot = q.semanas.map(w => DM(w.ini));
  const g = barras(rot, [{nome: 'Entradas (titulos + a vista)', v: q.semanas.map(w => w.rec + w.vista), cor: 'var(--v)'}, {nome: 'Pagamentos', v: q.semanas.map(w => -w.pag), cor: 'var(--c)'}], {h: 190});
  const fl = '<div class="card"><h3>Proximas 4 semanas</h3>' + g + q.semanas.map(w => linha(DM(w.ini) + ' a ' + DM(w.fim), '<span class="t-v">+' + BRL(w.rec + w.vista).replace('R$ ', '') + '</span> <span class="t-c">-' + BRL(w.pag).replace('R$ ', '') + '</span>')).join('') +
    '<p class="nt">Maiores saidas: ' + q.saidas.map(z => DM(z[0]) + ' (' + BRL(z[1]) + ')').join(', ') + '. Entradas incluem a venda a vista estimada em ' + BRL(q.vista_dia) + ' por dia.</p></div>';
  const pg = q.pagar;
  const pagar = '<div class="card"><h3>Contas a pagar</h3><div class="grid2">' + tile('Em aberto', BRL(pg.total), 'fornecedores ' + BRL(pg.forn)) + tile('Vencido', BRL(pg.v1_30 + pg.v31_90 + pg.v90), PCT((pg.v1_30 + pg.v31_90 + pg.v90) / (pg.total || 1), 0) + ' do total') + '</div><div style="height:10px"></div>' +

}
function sTop(d) {

function sPerdasItens(d) {
