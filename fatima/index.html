<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f2742">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel CEO">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" id="lkIcon" href="#">
<title>Painel CEO - Fatima - METODEX</title>
<style>
:root{--bg:#eef1f6;--surf:#fff;--surf2:#f5f7fb;--ink:#0b1f3a;--mut:#5a6b80;--line:#e1e7ef;--navy:#0f2742;--navy2:#1b4272;--gold:#c8962e;
--v:#12935a;--a:#c98900;--c:#d13b33;--vbg:#e2f5ea;--abg:#fdf1d4;--cbg:#fde5e3;--blue:#2b6cb0;--blue2:#a9c4e6;--sh:0 1px 2px rgba(15,39,66,.06),0 6px 20px rgba(15,39,66,.07)}
:root[data-theme=dark]{--bg:#08121f;--surf:#0f1e33;--surf2:#14263f;--ink:#eaf0f8;--mut:#93a4ba;--line:#1d3250;--navy:#0a1626;--navy2:#16355f;--gold:#e3b04b;
--v:#34d283;--a:#f2b632;--c:#ff6f64;--vbg:#0f3326;--abg:#3a2d0a;--cbg:#3d1714;--blue:#6aa8f0;--blue2:#2f527f;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#08121f;--surf:#0f1e33;--surf2:#14263f;--ink:#eaf0f8;--mut:#93a4ba;--line:#1d3250;--navy:#0a1626;--navy2:#16355f;--gold:#e3b04b;
--v:#34d283;--a:#f2b632;--c:#ff6f64;--vbg:#0f3326;--abg:#3a2d0a;--cbg:#3d1714;--blue:#6aa8f0;--blue2:#2f527f;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.35;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
/* trava */
#lock{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%)}
.lockbox{background:var(--surf);border-radius:24px;padding:30px 24px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lockbox img.lf{height:56px;margin-bottom:14px}.lockbox h1{font-size:21px;letter-spacing:-.3px}.lockbox p{color:var(--mut);font-size:13px;margin-top:4px}
.lockbox form{display:flex;flex-direction:column;gap:12px;margin:22px 0 8px}
.lockbox input{padding:15px 16px;border:1.5px solid var(--line);border-radius:14px;font-size:17px;background:var(--surf2);color:var(--ink);text-align:center}
.lockbox input:focus{outline:2px solid var(--gold);border-color:transparent}
.btn{background:var(--navy);color:#fff;border-radius:14px;padding:15px;font-weight:700;font-size:16px}
:root[data-theme=dark] .btn,.dk .btn{background:var(--gold);color:#1a1200}
.lockerr{color:var(--c);min-height:20px;font-size:13px}.lockbox img.lm{height:34px;margin-top:16px;border-radius:6px}
/* casca */
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
header.top{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;position:relative;z-index:20;border-radius:0 0 22px 22px;box-shadow:0 6px 24px rgba(8,18,31,.25)}
.hrow{display:flex;align-items:center;gap:10px}
.hrow .lg{background:#fff;border-radius:10px;padding:4px 8px;display:flex}.hrow .lg img{height:28px}
.hrow .tt{flex:1;min-width:0}.hrow .tt b{display:block;font-size:17px;letter-spacing:-.2px}.hrow .tt span{display:block;font-size:11.5px;opacity:.8;line-height:1.25}
.ib{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#fff}
.ib svg{width:20px;height:20px}
main{padding:14px 14px 8px}
.pg>*+*{margin-top:12px}
h2.st{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--mut);font-weight:700;margin:20px 4px 8px}
.card{background:var(--surf);border-radius:20px;padding:16px;box-shadow:var(--sh);border:1px solid var(--line)}
.card h3{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.card h3 small{font-weight:500;color:var(--mut);font-size:12px}
.note{font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.4}
.chip{font-size:11px;border-radius:999px;padding:3px 9px;font-weight:700;display:inline-block;white-space:nowrap}
.chip.v{background:var(--vbg);color:var(--v)}.chip.a{background:var(--abg);color:var(--a)}.chip.c{background:var(--cbg);color:var(--c)}.chip.n{background:var(--surf2);color:var(--mut)}
.t-v{color:var(--v)}.t-a{color:var(--a)}.t-c{color:var(--c)}.t-m{color:var(--mut)}
.seg{display:flex;background:var(--surf2);border-radius:14px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{flex:1;padding:10px 6px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:var(--sh)}
/* hero */
.hero{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
.hero .rt{font-size:12.5px;color:var(--mut)}.hero .big{font-size:27px;font-weight:800;letter-spacing:-.8px;line-height:1.1;margin:2px 0}
.hero .sub{font-size:13px;color:var(--mut);margin-top:2px}.hero .sub b{color:var(--ink)}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mini3>div{background:var(--surf2);border-radius:14px;padding:10px;min-width:0}.mini3 span{font-size:11.5px;color:var(--mut);display:block}.mini3 b{font-size:16px;display:block;margin-top:2px;white-space:nowrap}
/* farol */
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchips .chip{font-size:12.5px;padding:6px 12px}
/* carrossel kpi */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 14px 10px;margin:0 -14px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.kt{flex:0 0 150px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;scroll-snap-align:start;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:var(--sh);text-align:left;position:relative;overflow:hidden;min-height:128px}
.kt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--n,var(--line))}
.kt.v::before{background:var(--v)}.kt.a::before{background:var(--a)}.kt.c::before{background:var(--c)}
.kt .l{font-size:12px;color:var(--mut);font-weight:600}.kt .v1{font-size:23px;font-weight:800;letter-spacing:-.6px;margin:5px 0 2px;white-space:nowrap}
.kt .s{font-size:12px;color:var(--mut);line-height:1.3}.kt .s b{color:var(--ink)}
.kt .d{margin-top:6px;font-size:12px;font-weight:700}
/* alertas */
.al{display:flex;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh);text-align:left;width:100%;position:relative;overflow:hidden}
.al::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.al.c::before{background:var(--c)}.al.a::before{background:var(--a)}.al.v::before{background:var(--v)}
.al .ic{flex:0 0 30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;margin-left:4px}
.al.c .ic{background:var(--cbg);color:var(--c)}.al.a .ic{background:var(--abg);color:var(--a)}.al.v .ic{background:var(--vbg);color:var(--v)}
.al .tx{min-width:0;flex:1}.al .tx b{display:block;font-size:15px;margin-bottom:2px}.al .tx p{font-size:13.5px;color:var(--mut);line-height:1.4}
.al .dec{margin-top:6px;font-size:13px;color:var(--ink);font-weight:600}.al .dec i{font-style:normal;color:var(--gold);margin-right:4px}
.al .go{align-self:center;color:var(--mut)}
/* linhas e barras */
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:0}.row .k{color:var(--mut);min-width:0}.row .vv{font-weight:700;text-align:right;white-space:nowrap}
.row.tot{font-weight:800}.row.tot .k{color:var(--ink)}
.bar{height:10px;border-radius:99px;background:var(--surf2);position:relative;overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;display:block}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55;border-radius:2px}
.sec{padding:11px 0;border-top:1px solid var(--line)}.sec:first-of-type{border-top:0}
.sec .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:7px}.sec .h b{font-size:14.5px}.sec .h span{font-size:12.5px;font-weight:700}
.sec .m{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-top:6px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;background:var(--surf2)}.stack i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;font-size:12px;color:var(--mut)}.leg span{display:inline-flex;align-items:center;gap:5px}.leg em{width:10px;height:10px;border-radius:3px;display:inline-block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surf2);border-radius:14px;padding:11px 12px;min-width:0}.tile>span{font-size:12px;color:var(--mut);display:block}.tile b{font-size:19px;display:block;margin-top:2px;letter-spacing:-.4px;white-space:nowrap}.tile small{font-size:11.5px;color:var(--mut);display:block;margin-top:1px}
.more{display:block;width:100%;margin-top:6px;padding:11px;border-radius:12px;background:var(--surf2);color:var(--blue);font-weight:700;font-size:13.5px}
.tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:600}
svg text{font-family:inherit}
.chart{width:100%;height:auto;display:block}
.info{width:26px;height:26px;border-radius:50%;background:var(--surf2);color:var(--mut);font-weight:700;font-size:13px;flex:0 0 26px;display:inline-flex;align-items:center;justify-content:center}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surf) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;border-radius:14px;font-size:11px;font-weight:600;color:var(--mut);min-height:52px;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--navy);background:var(--surf2)}
:root[data-theme=dark] nav.tabs button.on{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) nav.tabs button.on{color:var(--gold)}}
nav.tabs .bd{position:absolute;top:3px;right:calc(50% - 20px);min-width:17px;height:17px;border-radius:9px;background:var(--c);color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:800}
/* gaveta */
#ov{position:fixed;inset:0;background:rgba(5,12,22,.55);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#ov.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surf);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease;max-width:560px;margin:0 auto}
#sheet.on{transform:none}
#sheet .gr{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
#sheet h4{font-size:18px;margin-bottom:8px}#sheet p{font-size:14.5px;color:var(--mut);margin-bottom:9px;line-height:1.5}#sheet p b{color:var(--ink)}
#sheet ul{padding-left:18px;font-size:14px;color:var(--mut);line-height:1.5}#sheet li{margin-bottom:6px}
.foot{text-align:center;color:var(--mut);font-size:12px;margin:22px 0 6px}.foot img{height:26px;display:block;margin:0 auto 8px;border-radius:5px;opacity:.9}
.foot button{color:var(--blue);font-weight:700;font-size:13px;padding:8px}
@media (min-width:600px){body{background:linear-gradient(var(--bg),var(--bg))}#app{box-shadow:0 0 0 1px var(--line)}}
@media (max-width:360px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.kt{flex-basis:138px}}
@media print{nav.tabs,.ib{display:none}}
@media (prefers-reduced-motion:reduce){#sheet,#ov{transition:none}}
</style>
</head>

 <div class="lockbox">

 </div>

function progresso(p, f, marca) { return '<div class="bar"><i style="width:' + Math.max(1.5, Math.min(100, (p || 0) * 100 / (marca ? 1.25 : 1))) + '%;background:' + cor(f) + '"></i>' + (marca ? '<u style="left:' + (100 / 1.25) + '%"></u>' : '') + '</div>'; }
function pilha(parts) { const t = parts.reduce((a, b) => a + Math.max(0, b.v), 0) || 1; return '<div class="stack">' + parts.map(p => '<i style="width:' + (Math.max(0, p.v) / t * 100) + '%;background:' + p.c + '"></i>').join('') + '</div><div class="leg">' + parts.map(p => '<span><em style="background:' + p.c + '"></em>' + esc(p.n) + ' <b style="color:var(--ink)">' + (p.l || PCT(Math.max(0, p.v) / t, 0)) + '</b></span>').join('') + '</div>'; }

/* ---------- gaveta (como foi calculado) ---------- */
function gaveta(titulo, corpo) { $('#sheetIn').innerHTML = '<h4>' + esc(titulo) + '</h4>' + corpo; $('#ov').classList.add('on'); $('#sheet').classList.add('on'); $('#sheet').scrollTop = 0; }
function fechar() { $('#ov').classList.remove('on'); $('#sheet').classList.remove('on'); }
$('#ov').addEventListener('click', fechar);
document.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });
const INFO = {};
function info(id, titulo, corpo) { INFO[id] = [titulo, corpo]; return 'data-info="' + id + '"'; }
document.addEventListener('click', e => { const t = e.target.closest('[data-info]'); if (t) { const i = INFO[t.dataset.info]; if (i) gaveta(i[0], i[1]); return; }
  const g = e.target.closest('[data-go]'); if (g) { ir(g.dataset.go); return; }
  const mo = e.target.closest('[data-modo]'); if (mo) { S.modo = mo.dataset.modo; render(); return; }
  const vm = e.target.closest('[data-more]'); if (vm) { S.ver[vm.dataset.more] = !S.ver[vm.dataset.more]; render(false); } });

/* ---------- blocos reutilizaveis ---------- */
const cur = () => M.mes[S.modo];
const ser = () => M.serie[S.modo];
function seletor() {
  if (M.modos.length < 2) return '';
  return '<div class="seg" role="tablist">' + M.modos.map(x => { const c = M.mes[x[0]]; return '<button data-modo="' + x[0] + '" class="' + (S.modo === x[0] ? 'on' : '') + '" role="tab">' + ML(x[1]) + (c.parcial ? ' (em andamento)' : ' (fechado)') + '</button>'; }).join('') + '</div>';
}
function kt(o) {
  return '<button class="kt ' + (o.f || '') + '" ' + info(o.id, o.nome, o.info) + '><div class="l">' + o.nome + '</div><div class="v1">' + o.valor + '</div><div class="s">' + o.sub + '</div><div class="d ' + tcl(o.f) + '">' + (o.f ? FN[o.f] : '&nbsp;') + (o.d ? ' - ' + o.d : '') + '</div></button>';
}
function linha(k, v, cls) { return '<div class="row ' + (cls || '') + '"><span class="k">' + k + '</span><span class="vv">' + v + '</span></div>'; }
function tile(l, v, s) { return '<div class="tile"><span>' + l + '</span><b>' + v + '</b>' + (s ? '<small>' + s + '</small>' : '') + '</div>'; }

/* ================= HOJE ================= */
function pgHoje() {
  const c = cur(), p = c.parcial;
  const sufP = p ? 'Projecao de fechamento' : 'Fechou em';
  const hero = '<div class="card"><div class="hero">' + ring(c.pct_proj, c.f_proj, 'da meta') +
    '<div><div class="rt">' + sufP + ' ' + ML(c.m) + '</div><div class="big">' + BRL(c.proj) + '</div><div class="sub">meta <b>' + BRL(c.meta) + '</b></div>' +
    '<div class="sub">' + (p ? 'dia <b>' + c.ate + '</b> de ' + c.dias + ' - vendido <b>' + BRL(c.tot) + '</b>' : 'venda no mes <b>' + BRL(c.tot) + '</b>') + '</div></div></div>' +
    '<div class="mini3"><div><span>' + (p ? 'mesmos dias, ano ant.' : 'contra ano anterior') + '</span><b class="' + tcl(c.f_yoy) + '">' + VAR(c.yoy) + '</b></div>' +
    '<div><span>margem bruta</span><b class="' + tcl(c.f_mg) + '">' + PCT(c.mg, 1) + '</b></div>' +
    '<div><span>ticket medio</span><b>R$ ' + nf(c.ticket, 2) + '</b></div></div></div>';
  const fc = M.farol;
  const farol = '<div class="fchips"><span class="chip v">' + fc.v + ' na meta</span><span class="chip a">' + fc.a + ' atencao</span><span class="chip c">' + fc.c + ' criticos</span></div>';
  const kpis = [
    kt({id: 'k_mg', nome: 'Margem bruta', valor: PCT(c.mg, 1), sub: 'meta <b>' + PCT(c.mg_meta, 1) + '</b>', f: c.f_mg, d: PP(c.mg - c.mg_meta),
        info: '<p>Lucro bruto da venda (apos impostos e custo) dividido pela <b>venda bruta total</b> da loja (varejo, atacado e repasse).</p><p>Meta 2026: <b>' + PCT(c.mg_meta, 1) + '</b>. No varejo isolado: ' + PCT(c.mg_var, 1) + ' contra meta ' + PCT(c.mg_var_meta, 1) + '. O atacado tem margem perto de zero e puxa a media para baixo.</p>'}),
    kt({id: 'k_yoy', nome: 'Crescimento', valor: VAR(c.yoy), sub: (p ? 'mesmos ' + c.ate + ' dias do ano ant.' : 'contra ano anterior') + '<br>meta <b>' + VAR(c.cresc_meta) + '</b>', f: c.f_yoy,
        info: '<p>Venda bruta total comparada com o <b>mesmo periodo</b> do ano anterior' + (p ? ' (dias 1 a ' + c.ate + ')' : '') + '.</p><p>' + (p ? 'Comparar so os mesmos dias evita o erro de achar que o mes cresce porque o comeco do mes vende mais (dia de pagamento).' : '') + '</p>'}),
    kt({id: 'k_tk', nome: 'Ticket medio', valor: 'R$ ' + nf(c.ticket, 2), sub: 'ano ant. <b>' + VAR(c.ticket_yoy) + '</b><br>meta ' + VAR(c.ticket_meta), f: c.f_ticket,
        info: '<p>Venda do varejo dividida pelo numero de cupons de varejo. Meta 2026: crescer <b>' + PCT(c.ticket_meta) + '</b> sobre o ano anterior.</p><p>Inflacao da cesta em 12 meses: ' + PCT(c.ipc_aa) + '.</p>'}),
    kt({id: 'k_fx', nome: 'Clientes', valor: NUM(c.cup), sub: NUM(c.cup_dia) + ' por dia<br>ano ant. <b>' + VAR(c.fluxo_yoy) + '</b>', f: c.f_fluxo,
        info: '<p>Cupons de varejo no periodo. Meta 2026: crescer <b>' + PCT(c.fluxo_meta) + '</b> no fluxo.</p>'}),
    kt({id: 'k_qb', nome: 'Quebra', valor: PCT(c.quebra_pct, 2), sub: 'meta <b>' + PCT(c.quebra_meta, 1) + '</b><br>' + BRL(c.quebra), f: c.f_quebra, d: PP(c.quebra_pct - c.quebra_meta),
        info: '<p>Perdas (vencimento, avaria, furto, nao identificadas no balanco) sobre a venda do varejo. Meta: <b>' + PCT(c.quebra_meta, 1) + '</b>.</p><p>Os lancamentos de perdas estao em implantacao; o numero real tende a ser maior que o lancado.</p>'}),
    kt({id: 'k_m2', nome: 'Venda por m2', valor: 'R$ ' + nf(c.m2, 0), sub: 'meta <b>R$ ' + nf(c.m2_meta, 0) + '</b><br>' + NUM(M.area_m2) + ' m2' + (p ? ' (proj.)' : ''), f: c.f_m2,
        info: '<p>Venda bruta total ' + (p ? 'projetada ' : '') + 'do mes dividida pela area de vendas (' + NUM(M.area_m2) + ' m2).</p>'}),
  ].join('');
  const al = M.alertas.slice(0, 5).map((a, i) => '<button class="al ' + a.sev + '" data-go="' + a.aba + '"><div class="ic">' + (a.sev === 'c' ? '!' : a.sev === 'a' ? '!' : '✓') + '</div><div class="tx"><b>' + esc(a.tit) + '</b><p>' + esc(a.txt) + '</p><div class="dec"><i>Decidir:</i>' + esc(a.dec) + '</div></div><span class="go">›</span></button>').join('');
  const mais = M.alertas.length > 5 ? '<button class="more" data-more="al">' + (S.ver.al ? 'Ocultar' : 'Ver mais ' + (M.alertas.length - 5) + ' alertas') + '</button>' : '';
  const alMais = S.ver.al ? M.alertas.slice(5).map(a => '<button class="al ' + a.sev + '" data-go="' + a.aba + '"><div class="ic">!</div><div class="tx"><b>' + esc(a.tit) + '</b><p>' + esc(a.txt) + '</p><div class="dec"><i>Decidir:</i>' + esc(a.dec) + '</div></div><span class="go">›</span></button>').join('') : '';
  const meio = c.secoes.slice(0, 3);
  const risco = '<div class="card"><h3>Onde agir primeiro <small>Resultado em Risco ' + BRL(c.risco_total) + '</small></h3>' + meio.map(s => '<div class="sec"><div class="h"><b>' + esc(s.nome) + '</b><span class="t-c">' + BRL(s.risco) + '</span></div><div class="m"><span>venda ' + PCT(s.pct, 0) + ' da meta</span><span>margem ' + PCT(s.mg, 1) + ' (meta ' + PCT(s.mgm, 1) + ')</span></div></div>').join('') +
    '<button class="more" data-go="comercial">Ver todas as secoes</button><p class="note">Resultado em Risco = margem que deixa de entrar por venda abaixo da meta, margem abaixo da meta e quebra acima da meta.</p></div>';
  return seletor() + hero + '<h2 class="st">Farol da loja</h2>' + farol + '<h2 class="st">Indicadores-chave</h2><div class="rail">' + kpis + '</div><h2 class="st">Decisoes do dia</h2><div class="pg">' + al + mais + alMais + '</div>' + '<h2 class="st">Foco comercial</h2>' + risco;
}

/* ================= COMERCIAL ================= */
function pgComercial() {
  const c = cur(), s = ser(), e = M.est, pr = c.promo, p = c.parcial;
  const ms = s.m.map(x => MESN[+x.slice(5,7)-1]);
  const g1 = barras(ms, [{nome: 'Venda bruta', v: s.tot, cor: 'var(--blue)', cores: s.tot.map((_, i) => s.parcial[i] ? 'var(--blue2)' : 'var(--blue)')}, {nome: 'Meta', tipo: 'linha', v: s.meta, cor: 'var(--gold)', pts: 1}, {nome: 'Ano anterior', tipo: 'linha', tra: 1, v: s.aa, cor: 'var(--mut)'}], {rotval: 1});
  const topo = '<div class="card"><h3>Venda x meta <small>' + (p ? 'barra clara = mes em andamento' : '13 meses') + '</small></h3>' +
    linha('Vendido ' + (p ? 'ate dia ' + c.ate : 'no mes'), '<b>' + BRL(c.tot) + '</b>') +
    (p ? linha('Meta ate hoje (perfil do ano ant.)', BRL(c.meta_prop)) + linha('Projecao de fechamento', '<b class="' + tcl(c.f_proj) + '">' + BRL(c.proj) + '</b>') : '') +
    linha('Meta do mes', BRL(c.meta)) + linha('Media por dia com venda', BRL(c.ritmo_dia) + ' <span class="t-m">(meta ' + BRL(c.ritmo_meta_dia) + ')</span>') + linha('Contra mes anterior', VAR(c.mom)) + '<div style="height:10px"></div>' + g1 + '</div>';
  const mix = '<div class="card"><h3>Composicao da venda</h3>' + pilha([{n: 'Varejo', v: c.var, c: 'var(--blue)'}, {n: 'Atacado', v: c.atac, c: 'var(--gold)'}, {n: 'Repasse', v: c.rep, c: 'var(--mut)'}]) + '<p class="note">Repasse e venda de terceiros sem margem relevante; o varejo e o motor do resultado.</p></div>';
  const mg = '<div class="card"><h3>Margem bruta <span class="chip ' + (c.f_mg || 'n') + '">' + (c.f_mg ? FN[c.f_mg] : '') + '</span></h3><div class="grid2">' + tile('Loja (varejo + atacado)', PCT(c.mg, 1), 'meta ' + PCT(c.mg_meta, 1) + ' - ' + PP(c.mg - c.mg_meta)) + tile('So varejo', PCT(c.mg_var, 1), 'meta ' + PCT(c.mg_var_meta, 1)) + '</div><div style="height:6px"></div>' + spark(s.mg, 320, 46, 'var(--gold)') + '<p class="note">Margem dos ultimos 13 meses. ' + (ok(c.mg_mom) ? 'Variacao contra o mes anterior: ' + PP(c.mg_mom) + '.' : '') + '</p></div>';
  const vis = S.ver.sec ? c.secoes : c.secoes.slice(0, 5);
  const secs = '<div class="card"><h3>Secoes: venda e margem <small>ordenado por Resultado em Risco</small></h3>' + vis.map(x => {
      const fv = x.pct == null ? null : x.pct >= 0.98 ? 'v' : x.pct >= 0.9 ? 'a' : 'c', fm = x.mg == null ? null : x.mg >= x.mgm ? 'v' : x.mg >= x.mgm - 0.01 ? 'a' : 'c';
      return '<div class="sec"><div class="h"><b>' + esc(x.nome) + '</b><span class="t-c">' + (x.risco > 0 ? BRL(x.risco) + ' em risco' : '') + '</span></div>' + progresso(x.pct, fv, 1) +
        '<div class="m"><span>venda <b class="' + tcl(fv) + '">' + PCT(x.pct, 0) + '</b> da meta (' + BRL(x.venda) + ')</span><span>margem <b class="' + tcl(fm) + '">' + PCT(x.mg, 1) + '</b> / ' + PCT(x.mgm, 1) + '</span></div></div>'; }).join('') +
    '<button class="more" data-more="sec">' + (S.ver.sec ? 'Mostrar menos' : 'Mostrar mais secoes') + '</button></div>';
  const dia = c.diario.length ? '<div class="card"><h3>Venda por dia <small>' + ML(c.m) + '</small></h3>' + barras(c.diario.map(d => d[0]), [{nome: 'Venda do dia', v: c.diario.map(d => d[1]), cor: 'var(--blue)', cores: c.diario.map(d => d[2] === 6 ? 'var(--gold)' : 'var(--blue)')}, {nome: 'Media', tipo: 'linha', v: c.diario.map(() => c.ritmo_dia), cor: 'var(--mut)', tra: 1}], {h: 160}) + '<p class="note">Barra dourada = domingo.</p></div>' : '';
  const pf = pr.limite != null && pr.part != null ? (pr.part > pr.limite ? 'a' : 'v') : null;
  const promo = '<div class="card"><h3>Promocoes</h3><div class="grid2">' + tile('Venda em promocao', PCT(pr.part, 1), 'limite ' + PCT(pr.limite, 1) + ' (media 2025)') + tile('Margem na promocao', PCT(pr.mg_promo, 1), 'sem promocao ' + PCT(pr.mg_normal, 1)) + '</div><div style="height:8px"></div>' + progresso(pr.limite ? pr.part / pr.limite : 0, pf, 0) +
    '<div style="height:6px"></div>' + linha('Produtos abaixo do custo em promocao', '<b class="' + (pr.custo ? 't-c' : 't-v') + '">' + pr.custo + '</b>') + linha('Promocoes quase permanentes', '<b class="' + (pr.perm ? 't-a' : '') + '">' + pr.perm + '</b>') + linha('Com queda de venda depois da promocao', pr.pos) +
    (pr.custo_nomes.length ? '<p class="note">Exemplos abaixo do custo: ' + pr.custo_nomes.map(esc).join(', ') + '.</p>' : '') + '</div>';
  const cobf = e.cob_atual != null && e.cob_ideal != null ? (e.cob_atual <= e.cob_ideal * 1.05 ? 'v' : e.cob_atual <= e.cob_ideal * 1.25 ? 'a' : 'c') : null;
  const est = '<div class="card"><h3>Estoque <small>posicao de ' + DM(e.data) + '</small></h3><div class="grid2">' + tile('Valor em estoque', BRL(e.valor), 'giro ERP') + tile('Acima do ideal', BRL(e.excesso), e.n_excesso + ' produtos') + '</div><div style="height:8px"></div>' +
    linha('Cobertura atual', '<b class="' + tcl(cobf) + '">' + NUM(e.cob_atual, 1) + ' dias</b>') + linha('Cobertura ideal da loja', NUM(e.cob_ideal, 1) + ' dias') + linha('Produtos em falta (sem saldo)', e.n_falta) +
    '<h3 style="margin-top:12px">Onde esta o excesso</h3>' + e.sec.map(x => { const mx = e.sec[0][1] || 1; return '<div class="sec"><div class="h"><b>' + esc(x[0]) + '</b><span>' + BRL(x[1]) + '</span></div><div class="bar"><i style="width:' + (x[1] / mx * 100) + '%;background:var(--a)"></i></div></div>'; }).join('') +
    '<p class="note">Ideal = nivel de cobertura que a propria secao ja atingiu em 1 de cada 4 meses (percentil 25 de 12 meses). Estoque acima disso e capital parado.</p></div>';
  return seletor() + topo + mix + mg + secs + dia + promo + est;
}

/* ================= RESULTADO ================= */
function pgResultado() {
  const r = M.res; if (!r) return '<div class="card">Sem DRE fechada.</div>';
  const L = r.linhas, eb = L[8], ll = L[10], rb = L[0].r, rl = L[2].r;
  const hero = '<div class="card"><h3>EBITDA de ' + ML(r.mes) + ' <span class="chip n">Fiscal - fechado</span></h3><div class="hero" style="grid-template-columns:1fr"><div><div class="big" style="font-size:32px">' + BRL(eb.r) + '</div><div class="sub"><b>' + PCT(r.ebitda_pct, 1) + '</b> da receita bruta - orcado <b>' + BRL(eb.o) + '</b></div><div class="sub">mes anterior <b>' + BRL(eb.a) + '</b> - lucro liquido <b class="' + (ll.r >= 0 ? 't-v' : 't-c') + '">' + BRL(ll.r) + '</b></div></div></div></div>';
  const sr = r.serie, ms = sr.m.map(ML);
  const g = barras(ms.map(x => x.slice(0, 3)), [{nome: 'EBITDA real', v: sr.ebitda, cor: 'var(--blue)', cores: sr.ebitda.map(v => v >= 0 ? 'var(--blue)' : 'var(--c)')}, {nome: 'Orcado', tipo: 'linha', v: sr.orc, cor: 'var(--gold)', pts: 1}], {h: 180, rotval: 1});
  const hist = '<div class="card"><h3>EBITDA - ultimos meses fechados</h3>' + g + '</div>';
  const mxv = Math.abs(rb) || 1;
  const dre = '<div class="card"><h3>DRE resumida <small>' + ML(r.mes) + '</small></h3><div class="row" style="color:var(--mut);font-size:12px"><span class="k">grupo</span><span class="vv" style="font-weight:600">realizado - % receita bruta - orcado</span></div>' + L.map(l => {
    const w = Math.min(100, Math.abs(l.r) / mxv * 100); const neg = l.r < 0;
    return '<div class="sec" style="padding:9px 0"><div class="h" style="margin-bottom:4px"><b style="font-weight:' + (l.t ? 800 : 500) + ';font-size:14px">' + l.n + '</b><span class="' + (l.t ? '' : 't-m') + '" style="font-size:14px">' + BRL(l.r) + '</span></div>' +
      '<div class="bar" style="height:7px"><i style="width:' + Math.max(1, w) + '%;background:' + (l.t ? 'var(--blue)' : neg ? 'var(--c)' : 'var(--v)') + ';opacity:' + (l.t ? 1 : .75) + '"></i></div><div class="m"><span>' + PCT(l.p, 1) + ' da receita bruta</span><span>orc. ' + BRL(l.o) + '</span></div></div>'; }).join('') + '<p class="note">CMV liquido ja considera bonificacoes de fornecedores e creditos tributarios. Resultado so do ultimo mes fechado pela contabilidade (' + ML(r.mes) + ').</p></div>';
  const gp = '<div class="card"><h3>Despesas por grupo <small>' + ML(r.mes) + ' x mes anterior</small></h3>' + r.grupos.map(x => { const dl = x[2] ? x[1] / x[2] - 1 : null; const mx = r.grupos[0][1] || 1;
    return '<div class="sec"><div class="h"><b>' + esc(x[0].replace(/^Despesas? (de )?/i, '').replace(/^./, c => c.toUpperCase())) + '</b><span>' + BRL(x[1]) + (ok(dl) ? ' <span class="' + (dl > 0.1 ? 't-c' : dl < -0.1 ? 't-v' : 't-m') + '" style="font-size:12px">' + VAR(dl) + '</span>' : '') + '</span></div><div class="bar"><i style="width:' + (x[1] / mx * 100) + '%;background:var(--navy2)"></i></div></div>'; }).join('') +
    linha('Total das despesas operacionais', '<b>' + BRL(r.desp_total) + '</b>', 'tot') + '</div>';
  const fin = '<div class="card"><h3>Saude financeira</h3><div class="grid2">' + tile('Carga de impostos', PCT(r.carga, 1), 'deducoes / receita bruta') + tile('EBITDA 12 meses', BRL(r.ebitda12), PCT(r.ebitda12_pct, 1) + ' da receita liquida') +
    tile('Divida bancaria', BRL(r.divida), 'curto prazo ' + BRL(r.divida_cp)) + tile('Divida liquida / EBITDA', ok(r.div_ebitda) ? nf(r.div_ebitda, 1) + 'x' : '-', 'balancete de ' + ML(r.bal_mes)) + '</div>' +
    '<p class="note">Divida liquida = emprestimos menos caixa, bancos e aplicacoes. Referencia usual de mercado: ate 2x a 3x o EBITDA anual.</p></div>';
  const pv = r.previa ? '<div class="card"><h3>Mes aberto <span class="chip n">Previa</span></h3>' + linha('Receita bruta ' + ML(r.previa_mes), BRL(r.previa.RB)) + linha('EBITDA parcial', BRL(r.previa.EBITDA)) + '<p class="note">Previa ainda sem fechamento da contabilidade: nao tem farol nem comparacao.</p></div>' : '';
  return hero + hist + dre + gp + fin + pv;
}

/* ================= CAIXA ================= */
function pgCaixa() {
  const x = M.cx, fcor = v => v < 0 ? 't-c' : '';
  const mv = x.menor_v, mt = x.menor;
  const hf = mv && mv[1] < 0 ? 'c' : (mt && mt[1] < 0 ? 'a' : 'v');
  const hero = '<div class="card"><h3>Caixa e bancos <span class="chip n">Contabil - ' + ML(x.disp_mes) + '</span></h3><div class="big" style="font-size:32px;font-weight:800;letter-spacing:-.8px">' + BRL(x.disp) + '</div><div class="sub" style="font-size:13px;color:var(--mut)">caixa ' + BRL(x.caixa) + ' - bancos ' + BRL(x.bancos) + (x.aplic ? ' - aplicacoes ' + BRL(x.aplic) : '') + '</div>' +
    '<div style="height:10px"></div><div class="al ' + hf + '" style="box-shadow:none"><div class="ic">' + (hf === 'v' ? '✓' : '!') + '</div><div class="tx"><b>Menor saldo projetado (30 dias)</b><p>So titulos: <b class="' + fcor(mt[1]) + '">' + BRL(mt[1]) + '</b> em ' + DM(mt[0]) + '. Com a venda a vista estimada: <b class="' + fcor(mv[1]) + '">' + BRL(mv[1]) + '</b> em ' + DM(mv[0]) + '.</p></div></div></div>';
  const sem = x.semanas, rot = sem.map(w => DM(w.ini).slice(0, 5));
  const g = barras(rot, [{nome: 'A receber (titulos)', v: sem.map(w => w.rec), cor: 'var(--v)'}, {nome: 'A pagar (titulos)', v: sem.map(w => -w.pag), cor: 'var(--c)'}, {nome: 'Saldo so titulos', tipo: 'linha', v: sem.map(w => w.saldo_t), cor: 'var(--blue)', pts: 1}, {nome: 'Saldo com venda a vista', tipo: 'linha', tra: 1, v: sem.map(w => w.saldo_v), cor: 'var(--gold)', pts: 1}], {h: 220});
  const fluxo = '<div class="card"><h3>Fluxo dos proximos 30 dias <button class="info" ' + info('fl', 'Como o fluxo foi projetado', '<p><b>Saldo inicial:</b> caixa + bancos + aplicacoes do balancete (' + ML(x.disp_mes) + ', mes em previa).</p><p><b>Entradas:</b> titulos a receber (duplicatas, cartoes, clientes) por data de vencimento, mais a venda a vista estimada em <b>' + BRL(x.vista_dia) + '/dia</b> (media dos 3 ultimos meses fechados, dinheiro + PIX a vista).</p><p><b>Saidas:</b> titulos a pagar por data de vencimento. Folha e impostos so entram se estiverem lancados como titulo.</p><p>E uma estimativa gerencial: confira com o extrato antes de decidir.</p>') + ' aria-label="Como foi calculado">i</button></h3>' + g +
    sem.map(w => linha(DM(w.ini) + ' a ' + DM(w.fim), '<span class="t-v">+' + BRL(w.rec).replace('R$ ', '') + '</span> <span class="t-c">-' + BRL(w.pag).replace('R$ ', '') + '</span>')).join('') +
    '<p class="note">Maiores saidas: ' + x.pior_saida.map(d => DM(d[0]) + ' (' + BRL(d[2]) + ')').join(', ') + '.</p></div>';
  const pg = x.pagar, pfs = pg.total || 1;
  const pagar = '<div class="card"><h3>Contas a pagar</h3><div class="grid2">' + tile('Total em aberto', BRL(pg.total), 'fornecedores de mercadoria ' + BRL(x.pagar_forn.total)) + tile('Vencido', BRL(x.pagar_venc), PCT(x.pagar_venc / pfs, 0) + ' do total') + '</div><div style="height:10px"></div>' +
    pilha([{n: 'A vencer', v: pg.a_vencer, c: 'var(--blue)', l: BRL(pg.a_vencer)}, {n: '1-30 d', v: pg.v1_30, c: 'var(--a)', l: BRL(pg.v1_30)}, {n: '31-90 d', v: pg.v31_90, c: 'var(--c)', l: BRL(pg.v31_90)}, {n: '+90 d', v: pg.v90, c: '#8e2a24', l: BRL(pg.v90)}]) +
    '<p class="note">Vencido ha mais de 30 dias pode incluir titulo sem baixa (acao A03 do plano): validar antes de pagar.</p></div>';
  const rc = x.receber, tot = x.receber_total || 1;
  const vc = o => o.v1_30 + o.v31_90 + o.v90;
  const receber = '<div class="card"><h3>Contas a receber</h3><div class="grid2">' + tile('Total em aberto', BRL(x.receber_total), 'duplicatas, cartoes e clientes') + tile('Inadimplencia 30d', PCT(x.inad_30, 1), '1 ano: ' + PCT(x.inad_1ano, 1)) + '</div><div style="height:6px"></div>' +
    linha('Duplicatas', BRL(rc.dup.total) + ' <span class="t-m">(vencido ' + BRL(vc(rc.dup)) + ')</span>') + linha('Cartoes a receber', BRL(rc.cartao.total) + ' <span class="t-m">(vencido ' + BRL(vc(rc.cartao)) + ')</span>') + linha('Clientes (crediario)', BRL(rc.cli.total) + ' <span class="t-m">(vencido ' + BRL(vc(rc.cli)) + ')</span>') + linha('Verbas a receber de fornecedores', BRL(rc.verbas.total)) +
    '<p class="note">Cartao vencido e a conciliar com as adquirentes (acao A04).</p></div>';
  const f = x.forma, tf = f.total || 1;
  const cart = '<div class="card"><h3>Cartoes e formas de pagamento <small>' + ML(f.mes) + '</small></h3>' + pilha([{n: 'Cartao', v: f.cartao, c: 'var(--blue)'}, {n: 'A vista', v: f.vista, c: 'var(--v)'}, {n: 'A prazo', v: f.prazo, c: 'var(--a)'}, {n: 'Cheque', v: f.cheque_pre + f.cheque_vista, c: 'var(--mut)'}]) +
    '<div style="height:8px"></div>' + linha('Vendas no cartao', BRL(f.cartao)) + linha('Taxas de cartao pagas', BRL(f.taxa) + ' <span class="t-m">(' + PCT(f.taxa_pct, 2) + ' do cartao)</span>') + '</div>';
  const chq = '<div class="card"><h3>Cheques</h3><div class="grid2">' + tile('Pre-datado recebido', BRL(f.cheque_pre), ML(f.mes)) + tile('A vista recebido', BRL(f.cheque_vista), ML(f.mes)) + '</div>' + spark(f.serie.map(z => z[4]), 320, 40, 'var(--mut)') + '<p class="note">Ultimos 6 meses. A base nao tem a carteira de cheques a depositar nem cheques devolvidos: so o recebido no mes.</p></div>';
  const cic = '<div class="card"><h3>Ciclo financeiro</h3><div class="grid2">' + tile('Estoque (PME)', NUM(x.pme, 1) + ' dias') + tile('Recebimento (PMR)', NUM(x.pmr, 1) + ' dias') + tile('Pagamento (PMP)', NUM(x.pmp, 1) + ' dias') + tile('Ciclo de caixa', NUM(x.ciclo, 1) + ' dias', 'PME + PMR - PMP') + '</div><div style="height:8px"></div>' + spark(x.hist.filter(h => ok(h[3])).map(h => h[3]), 320, 40, 'var(--gold)') + '<p class="note">Evolucao do ciclo nas ultimas leituras.</p></div>';
  const dev = '<div class="card"><h3>Maiores devedores do crediario</h3>' + x.devedores.map(d => linha(esc(d[0].toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase())), BRLf(d[1]))).join('') + '</div>';
  return hero + fluxo + pagar + receber + cart + chq + cic + dev;
}

/* ================= OPERACAO ================= */
function pgOperacao() {
  const c = cur(), o = M.op, r = o.rup, pd = o.ped, pl = o.plano;
  const qf = c.f_quebra;
  const sq = c.secoes.slice().sort((a, b) => b.quebra - a.quebra).slice(0, 5);
  const quebra = '<div class="card"><h3>Quebra <small>' + ML(c.m) + '</small></h3><div class="grid2">' + tile('Quebra', '<span class="' + tcl(qf) + '">' + PCT(c.quebra_pct, 2) + '</span>', 'meta ' + PCT(c.quebra_meta, 1) + ' - ' + BRL(c.quebra)) + tile('Nao identificada', BRL(c.quebra_nao), 'ajuste de balanco') + '</div><h3 style="margin-top:12px">Por tipo</h3>' +
    c.quebra_tipo.map(t => { const mx = c.quebra_tipo[0][1] || 1; return '<div class="sec"><div class="h"><b>' + esc(t[0]) + '</b><span>' + BRL(t[1]) + '</span></div><div class="bar"><i style="width:' + (t[1] / mx * 100) + '%;background:var(--c)"></i></div></div>'; }).join('') +
    '<h3 style="margin-top:12px">Secoes com mais quebra</h3>' + sq.map(s => linha(esc(s.nome), BRL(s.quebra) + ' <span class="t-m">(' + PCT(s.var ? s.quebra / s.var : null, 1) + ')</span>')).join('') +
    '<p class="note">Lancamentos de perdas em implantacao: o valor real tende a ser maior que o lancado.</p></div>';
  const rf = ok(r.pct) && r.meta ? (r.pct <= r.meta ? 'v' : r.pct <= r.meta * 1.5 ? 'a' : 'c') : null;
  const rup = '<div class="card"><h3>Ruptura <button class="info" ' + info('rup', 'Ruptura pela regua de giro', '<p>Item monitorado = vende pelo menos 18 dias por mes. Ruptura presumida = dias seguidos sem venda acima do normal para o giro do item (chance de acaso menor que 2%). Com saldo no sistema = <b>gondola</b> (esta no estoque mas nao na prateleira); sem saldo = <b>estoque</b>.</p><p>Meta 2026: ate <b>' + PCT(r.meta, 0) + '</b>.</p>') + ' aria-label="Como foi calculado">i</button></h3><div class="grid2">' + tile('Itens sinalizados', '<span class="' + tcl(rf) + '">' + PCT(r.pct, 1) + '</span>', r.sinal + ' de ' + r.monit + ' - meta ' + PCT(r.meta, 0)) + tile('Na gondola', r.gondola, 'tem saldo, falta na prateleira') + '</div>' +
    linha('Sem saldo no estoque', r.estoque) + linha('Sem controle de saldo', r.sem_ctrl) + '<p class="note">Semana de ' + (Array.isArray(r.semana) ? DM(r.semana[0]) + ' a ' + DM(r.semana[1]) : '-') + '.</p></div>';
  const mxf = pd.forn.length ? Math.max(...pd.forn.map(z => z[2])) || 1 : 1;
  const ped = '<div class="card"><h3>Pedidos de compra <span class="chip a">Base em validacao</span></h3><div class="grid2">' + tile('Pendente', BRL(pd.valor), pd.pedidos + ' pedidos') + tile('Vencido', '<span class="t-c">' + BRL(pd.vencido) + '</span>', NUM(pd.vencido_itens) + ' itens - atraso mediano ' + NUM(pd.atraso_med) + ' dias') + '</div>' + linha('A vencer', BRL(pd.a_vencer)) + linha('Sem data de entrega', BRL(pd.sem_data)) +
    '<h3 style="margin-top:12px">Fornecedores com mais atraso</h3>' + pd.forn.map(z => '<div class="sec"><div class="h"><b>' + esc(z[0].toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase())) + '</b><span class="t-c">' + BRL(z[2]) + '</span></div><div class="bar"><i style="width:' + (z[2] / mxf * 100) + '%;background:var(--c)"></i></div></div>').join('') + '</div>';
  const st = pl.cnt, ct = (k) => st[k] || 0;
  const plano = '<div class="card"><h3>Plano de acao <small>' + pl.total + ' acoes</small></h3>' + pilha([{n: 'Concluidas', v: ct('Concluida'), c: 'var(--v)', l: ct('Concluida')}, {n: 'Em curso', v: ct('Em andamento') + ct('Em execucao'), c: 'var(--blue)', l: ct('Em andamento') + ct('Em execucao')}, {n: 'Nao iniciadas', v: ct('Nao iniciada'), c: 'var(--mut)', l: ct('Nao iniciada')}, {n: 'Atrasadas', v: ct('Atrasada'), c: 'var(--c)', l: ct('Atrasada')}]) +
    '<h3 style="margin-top:14px">Atrasadas <small>' + pl.n_atr + ' no total</small></h3>' + pl.atrasadas.map(a => '<div class="sec"><div class="h"><b style="font-size:14px">' + esc(a.id) + ' - ' + esc(a.quem) + '</b><span class="t-c">' + (a.dias != null ? a.dias + ' d' : '') + '</span></div><p style="font-size:13.5px;color:var(--mut)">' + esc(a.o_que) + '</p></div>').join('') +
    '<p class="note">Todas as acoes tem o CEO como dono do resultado; defina o dono operacional e a nova data na reuniao semanal.</p></div>';
  return seletor() + quebra + rup + ped + plano;
}

/* ================= navegacao ================= */
const ICO = {
  hoje: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  comercial: '<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
  resultado: '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5c0-1.2 1.3-2 3-2s3 .8 3 2-1.3 1.8-3 2-3 .8-3 2 1.3 2 3 2 3-.8 3-2"/>',
  caixa: '<rect x="2" y="6" width="20" height="13" rx="3"/><path d="M2 11h20M6 16h4"/>',
  operacao: '<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 12l9-5M12 12v10M12 12L3 7"/>',
};
const TABS = [['hoje', 'Hoje'], ['comercial', 'Comercial'], ['resultado', 'Resultado'], ['caixa', 'Caixa'], ['operacao', 'Operacao']];
const PAGS = {hoje: pgHoje, comercial: pgComercial, resultado: pgResultado, caixa: pgCaixa, operacao: pgOperacao};
function ir(t) { S.tab = t; render(); window.scrollTo({top: 0}); }
function render(topo) {
  $('#pg').innerHTML = PAGS[S.tab]();
  const nc = M.alertas.filter(a => a.sev === 'c').length;
  $('#tabsIn').innerHTML = TABS.map(t => '<button data-go="' + t[0] + '" class="' + (S.tab === t[0] ? 'on' : '') + '" aria-label="' + t[1] + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + ICO[t[0]] + '</svg>' + t[1] + (t[0] === 'hoje' && nc ? '<span class="bd">' + nc + '</span>' : '') + '</button>').join('');
  const g = M.gerado_em || '';
  $('#hS').textContent = 'Dados de ' + DM(M.ref) + ' - atualizado ' + g.slice(8, 10) + '/' + g.slice(5, 7) + ' as ' + g.slice(11, 16);
  const tt = {hoje: 'Hoje', comercial: 'Comercial', resultado: 'Resultado', caixa: 'Caixa', operacao: 'Operacao'};
  $('#hT').textContent = S.tab === 'hoje' ? 'Painel CEO' : tt[S.tab];
  document.title = 'Painel CEO - Fatima';
  if (!$('#rodape')) { const f = document.createElement('div'); f.id = 'rodape'; $('main').appendChild(f); }
  $('#rodape').innerHTML = '<div class="foot"><img src="' + LM + '" alt="METODEX">Painel Executivo v' + esc(M.versao) + ' - METODEX<br><button data-info="qual">Qualidade dos dados</button></div>';
}
function iniciar() {
  S.modo = M.padrao;
  INFO.qual = ['Qualidade dos dados', '<p>Pontos de atencao antes de decidir:</p><ul>' + M.qualidade.map(q => '<li>' + esc(q) + '</li>').join('') + '</ul><p>Fontes atualizadas: ' + Object.keys(M.fontes).filter(k => M.fontes[k]).slice(0, 8).map(k => esc(k) + ' ' + esc(String(M.fontes[k]).slice(0, 10))).join(' - ') + '.</p>'];
  const tema = (() => { try { return localStorage.getItem('tema'); } catch (e) { return null; } })();
  if (tema) document.documentElement.dataset.theme = tema;
  $('#bTema').addEventListener('click', () => { const dk = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; const n = dk ? 'light' : 'dark'; document.documentElement.dataset.theme = n; try { localStorage.setItem('tema', n); } catch (e) {} });
  render();
}
if (CLARO) { M = CLARO; entrar(); }
/* instalar na tela inicial: so funciona quando o arquivo esta hospedado em https */
if (location.protocol === 'https:') {
  try { const man = {name: 'Painel CEO - Fatima', short_name: 'Painel CEO', display: 'standalone', background_color: '#0f2742', theme_color: '#0f2742', start_url: location.href, icons: [{src: LF, sizes: '192x192', type: 'image/png'}]};
    const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(man)], {type: 'application/manifest+json'})); document.head.appendChild(l); } catch (e) {}
}
</script>
