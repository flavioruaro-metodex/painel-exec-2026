<title>MEX-FATIMA - METODEX</title>
<style>
:root{--bg:#eef1f6;--surf:#fff;--surf2:#f5f7fb;--ink:#0b1f3a;--mut:#5a6b80;--line:#e1e7ef;--navy:#0f2742;--navy2:#1b4272;--gold:#c8962e;
--v:#12935a;--a:#c98900;--c:#d13b33;--vbg:#e2f5ea;--abg:#fdf1d4;--cbg:#fde5e3;--blue:#2b6cb0;--blue2:#a9c4e6;--sh:0 1px 2px rgba(15,39,66,.06),0 6px 20px rgba(15,39,66,.07)}
:root[data-theme=dark]{--bg:#08121f;--surf:#0f1e33;--surf2:#14263f;--ink:#eaf0f8;--mut:#93a4ba;--line:#1d3250;--navy:#0a1626;--navy2:#16355f;--gold:#e3b04b;
--v:#34d283;--a:#f2b632;--c:#ff6f64;--vbg:#0f3326;--abg:#3a2d0a;--cbg:#3d1714;--blue:#6aa8f0;--blue2:#2f527f;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#08121f;--surf:#0f1e33;--surf2:#14263f;--ink:#eaf0f8;--mut:#93a4ba;--line:#1d3250;--navy:#0a1626;--navy2:#16355f;--gold:#e3b04b;
--v:#34d283;--a:#f2b632;--c:#ff6f64;--vbg:#0f3326;--abg:#3a2d0a;--cbg:#3d1714;--blue:#6aa8f0;--blue2:#2f527f;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.35;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
/* trava */
#lock{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%)}
.lockbox{background:var(--surf);border-radius:24px;padding:30px 24px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lockbox img.lf{height:56px;margin-bottom:14px}.lockbox h1{font-size:21px;letter-spacing:-.3px}.lockbox p{color:var(--mut);font-size:13px;margin-top:4px}
.lockbox form{display:flex;flex-direction:column;gap:12px;margin:22px 0 8px}
.lockbox input{padding:15px 16px;border:1.5px solid var(--line);border-radius:14px;font-size:17px;background:var(--surf2);color:var(--ink);text-align:center}
.lockbox input:focus{outline:2px solid var(--gold);border-color:transparent}
.btn{background:var(--navy);color:#fff;border-radius:14px;padding:15px;font-weight:700;font-size:16px}
:root[data-theme=dark] .btn,.dk .btn{background:var(--gold);color:#1a1200}
.lockerr{color:var(--c);min-height:20px;font-size:13px}.lockbox img.lm{height:34px;margin-top:16px;border-radius:6px}
/* casca */
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
header.top{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;position:relative;z-index:20;border-radius:0 0 22px 22px;box-shadow:0 6px 24px rgba(8,18,31,.25)}
.hrow{display:flex;align-items:center;gap:10px}
.hrow .lg{background:#fff;border-radius:10px;padding:4px 8px;display:flex}.hrow .lg img{height:28px}
.hrow .tt{flex:1;min-width:0}.hrow .tt b{display:block;font-size:17px;letter-spacing:-.2px}.hrow .tt span{display:block;font-size:11.5px;opacity:.8;line-height:1.25}
.ib{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#fff}
.ib svg{width:20px;height:20px}
main{padding:14px 14px 8px}
.pg>*+*{margin-top:12px}
h2.st{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--mut);font-weight:700;margin:20px 4px 8px}
.card{background:var(--surf);border-radius:20px;padding:16px;box-shadow:var(--sh);border:1px solid var(--line)}
.card h3{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.card h3 small{font-weight:500;color:var(--mut);font-size:12px}
.note{font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.4}
.chip{font-size:11px;border-radius:999px;padding:3px 9px;font-weight:700;display:inline-block;white-space:nowrap}
.chip.v{background:var(--vbg);color:var(--v)}.chip.a{background:var(--abg);color:var(--a)}.chip.c{background:var(--cbg);color:var(--c)}.chip.n{background:var(--surf2);color:var(--mut)}
.t-v{color:var(--v)}.t-a{color:var(--a)}.t-c{color:var(--c)}.t-m{color:var(--mut)}
.seg{display:flex;background:var(--surf2);border-radius:14px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{flex:1;padding:10px 6px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:var(--sh)}
/* hero */
.hero{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
.hero .rt{font-size:12.5px;color:var(--mut)}.hero .big{font-size:27px;font-weight:800;letter-spacing:-.8px;line-height:1.1;margin:2px 0}
.hero .sub{font-size:13px;color:var(--mut);margin-top:2px}.hero .sub b{color:var(--ink)}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mini3>div{background:var(--surf2);border-radius:14px;padding:10px;min-width:0}.mini3 span{font-size:11.5px;color:var(--mut);display:block}.mini3 b{font-size:16px;display:block;margin-top:2px;white-space:nowrap}
/* farol */
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchips .chip{font-size:12.5px;padding:6px 12px}
/* carrossel kpi */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 14px 10px;margin:0 -14px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.kt{flex:0 0 150px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;scroll-snap-align:start;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:var(--sh);text-align:left;position:relative;overflow:hidden;min-height:128px}
.kt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--n,var(--line))}
.kt.v::before{background:var(--v)}.kt.a::before{background:var(--a)}.kt.c::before{background:var(--c)}
.kt .l{font-size:12px;color:var(--mut);font-weight:600}.kt .v1{font-size:23px;font-weight:800;letter-spacing:-.6px;margin:5px 0 2px;white-space:nowrap}
.kt .s{font-size:12px;color:var(--mut);line-height:1.3}.kt .s b{color:var(--ink)}
.kt .d{margin-top:6px;font-size:12px;font-weight:700}
/* alertas */
.al{display:flex;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh);text-align:left;width:100%;position:relative;overflow:hidden}
.al::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.al.c::before{background:var(--c)}.al.a::before{background:var(--a)}.al.v::before{background:var(--v)}
.al .ic{flex:0 0 30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;margin-left:4px}
.al.c .ic{background:var(--cbg);color:var(--c)}.al.a .ic{background:var(--abg);color:var(--a)}.al.v .ic{background:var(--vbg);color:var(--v)}
.al .tx{min-width:0;flex:1}.al .tx b{display:block;font-size:15px;margin-bottom:2px}.al .tx p{font-size:13.5px;color:var(--mut);line-height:1.4}
.al .dec{margin-top:6px;font-size:13px;color:var(--ink);font-weight:600}.al .dec i{font-style:normal;color:var(--gold);margin-right:4px}
.al .go{align-self:center;color:var(--mut)}
/* linhas e barras */
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:0}.row .k{color:var(--mut);min-width:0}.row .vv{font-weight:700;text-align:right;white-space:nowrap}
.row.tot{font-weight:800}.row.tot .k{color:var(--ink)}
.bar{height:10px;border-radius:99px;background:var(--surf2);position:relative;overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;display:block}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55;border-radius:2px}
.sec{padding:11px 0;border-top:1px solid var(--line)}.sec:first-of-type{border-top:0}
.sec .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:7px}.sec .h b{font-size:14.5px}.sec .h span{font-size:12.5px;font-weight:700}
.sec .m{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-top:6px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;background:var(--surf2)}.stack i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;font-size:12px;color:var(--mut)}.leg span{display:inline-flex;align-items:center;gap:5px}.leg em{width:10px;height:10px;border-radius:3px;display:inline-block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surf2);border-radius:14px;padding:11px 12px;min-width:0}.tile>span{font-size:12px;color:var(--mut);display:block}.tile b{font-size:19px;display:block;margin-top:2px;letter-spacing:-.4px;white-space:nowrap}.tile small{font-size:11.5px;color:var(--mut);display:block;margin-top:1px}
.more{display:block;width:100%;margin-top:6px;padding:11px;border-radius:12px;background:var(--surf2);color:var(--blue);font-weight:700;font-size:13.5px}
.tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:600}

.ind{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:14px 14px 12px;box-shadow:var(--sh);position:relative;overflow:hidden;width:100%;text-align:left;display:block}
.ind::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
.ind.v::before{background:var(--v)}.ind.a::before{background:var(--a)}.ind.c::before{background:var(--c)}
.ind .t{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-left:4px}.ind .t b{font-size:13.5px;color:var(--mut);font-weight:700}
.ind .m{display:grid;grid-template-columns:1fr 96px;gap:10px;align-items:end;margin:4px 0 2px 4px}
.ind .v1{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1}.ind .s{font-size:13px;color:var(--mut);margin-top:3px}.ind .s b{color:var(--ink)}
.ind .fr{margin:8px 0 0 4px;font-size:13.5px;font-weight:600}
.chain{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chain>div{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:9px 11px;position:relative}
.chain .g{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;display:flex;align-items:center;gap:6px}.chain .g i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chain .x{font-size:12.5px;color:var(--mut);margin-top:3px;line-height:1.3}
.gb{display:flex;align-items:center;gap:12px}.gb .dot{width:46px;height:46px;border-radius:50%;flex:0 0 46px}
.pill{display:inline-block;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800}
.pill.v{background:var(--vbg);color:var(--v)}.pill.a{background:var(--abg);color:var(--a)}.pill.c{background:var(--cbg);color:var(--c)}.pill.n{background:var(--surf2);color:var(--mut)}
.dec{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:13px 14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.dec::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px}.dec.c::before{background:var(--c)}.dec.a::before{background:var(--a)}
.dec b{display:block;font-size:15.5px;margin:0 0 3px 4px}.dec p{font-size:13.5px;color:var(--mut);margin-left:4px}
.dec .w{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 0 4px;font-size:12.5px;font-weight:700}.dec .w span{color:var(--ink)}.dec .w em{font-style:normal;color:var(--mut);font-weight:600}

:root{--y:#FFC800}
header.top{border-bottom:4px solid var(--y)}
.capa{background:linear-gradient(150deg,#0f2742 0%,#1b4272 100%);color:#fff;border-radius:24px;padding:18px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.capa::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,0,.28),rgba(255,200,0,0) 70%)}
.capa .k{font-size:12px;letter-spacing:.9px;font-weight:800;color:var(--y);text-transform:uppercase}
.capa h1{font-size:22px;line-height:1.2;letter-spacing:-.5px;margin:6px 0 12px;font-weight:800}
.capa .row2{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center}
.capa .cnt{display:flex;flex-direction:column;gap:6px}.capa .cnt span{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}.capa .cnt i{width:12px;height:12px;border-radius:50%;display:inline-block}
.capa .sub{font-size:12.5px;opacity:.8;margin-top:12px;line-height:1.4}
.com{background:var(--surf);border:1px solid var(--line);border-left:6px solid var(--y);border-radius:20px;padding:15px 15px 12px;box-shadow:var(--sh)}
.com .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.com .hd b{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.com h5{font-size:12.5px;font-weight:800;margin:10px 0 3px;color:var(--ink)}.com h5:first-of-type{margin-top:2px}
.com p{font-size:14.5px;line-height:1.5;color:var(--ink);margin:0 0 5px}.com ul{padding-left:18px;margin:0}.com li{font-size:14.5px;line-height:1.5;margin-bottom:4px}
.rg{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:13px 14px 12px;box-shadow:var(--sh);position:relative;overflow:hidden}
.rg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
.rg.v::before{background:var(--v)}.rg.a::before{background:var(--a)}.rg.c::before{background:var(--c)}
.rg .h{display:flex;justify-content:space-between;align-items:center;margin-left:4px}.rg .h b{font-size:13.5px;color:var(--mut);font-weight:700}
.rg .big{font-size:28px;font-weight:800;letter-spacing:-.9px;margin:2px 0 0 4px;line-height:1.15}
.rg .cmp{display:flex;gap:14px;flex-wrap:wrap;margin:5px 0 0 4px;font-size:12.5px;color:var(--mut)}.rg .cmp b{color:var(--ink)}
.d{font-style:normal;font-weight:800;font-size:12px;margin-left:3px}.d.g{color:var(--v)}.d.b{color:var(--c)}.d.n{color:var(--mut)}
.bt{position:relative;height:10px;border-radius:99px;margin:11px 4px 3px 4px;display:flex;overflow:hidden;background:var(--surf2)}
.bt i{height:100%;display:block}.bt .zr{background:var(--c);opacity:.28}.bt .za{background:var(--a);opacity:.35}.bt .zg{background:var(--v);opacity:.32}
.bl{position:relative;height:0;margin:0 4px}.bl .val{position:absolute;top:-17px;width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid var(--surf);transform:translateX(-5px);box-shadow:0 0 0 1px var(--ink)}
.bl .mk{position:absolute;top:-21px;width:2px;height:18px;background:var(--y);box-shadow:0 0 0 1px rgba(0,0,0,.25);transform:translateX(-1px)}
.rg .mt{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:12px 4px 0 4px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.heat div{border-radius:12px;padding:8px 2px;text-align:center;background:var(--surf2);position:relative}
.heat small{display:block;font-size:10.5px;color:var(--mut);font-weight:700;text-transform:uppercase}.heat b{display:block;font-size:14px;margin-top:2px}
.heat .fe{position:absolute;top:2px;right:4px;font-size:9px;font-weight:800;color:var(--y)}
.heat .h-v{background:var(--vbg)}.heat .h-v b{color:var(--v)}.heat .h-a{background:var(--abg)}.heat .h-a b{color:var(--a)}.heat .h-c{background:var(--cbg)}.heat .h-c b{color:var(--c)}
.jg .r{padding:10px 0;border-top:1px solid var(--line)}.jg .r:first-of-type{border-top:0}.jg .r .t{display:flex;justify-content:space-between;gap:8px;font-size:14px}.jg .r .t b{white-space:nowrap}
.jg .bar{margin-top:7px}
.opt{display:flex;gap:8px;margin-top:10px}.opt button{flex:1;padding:14px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--surf2);font-weight:700;font-size:14px}.opt button.on{border-color:var(--y);background:var(--abg);color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th{font-size:11.5px;color:var(--mut);text-align:right;padding:4px 0;font-weight:700}.tbl th:first-child,.tbl td:first-child{text-align:left}.tbl td{padding:8px 0;border-top:1px solid var(--line);text-align:right}.tbl td:first-child{color:var(--mut)}
.inst{display:flex;align-items:center;gap:8px;margin:12px 14px 0;background:var(--y);color:#1a1200;border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:600;box-shadow:var(--sh)}.inst span{flex:1}.inst button{background:#0f2742;color:#fff;border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px}.inst #bInstFechar{background:none;color:#1a1200;font-size:22px;padding:0 6px;line-height:1}
.off{margin:10px 14px 0;background:var(--abg);color:var(--a);border:1px solid var(--a);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:700}

.it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.it:first-of-type{border-top:0}.it b{font-size:14px}.it small{display:block;color:var(--mut);font-size:12px;margin-top:1px}.it .v{font-weight:800;white-space:nowrap;text-align:right;font-size:14px}.it .v small{font-weight:600}
.dchips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}.dchips button{padding:10px 2px;border-radius:14px;background:var(--surf);border:1px solid var(--line);font-weight:800;font-size:13px;color:var(--mut);position:relative}.dchips button small{display:block;font-size:10px;font-weight:600;margin-top:1px}.dchips button.on{background:var(--navy);color:var(--y);border-color:var(--navy)}.dchips button.hoje::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--y)}
.rei{display:flex;align-items:baseline;gap:10px;margin:2px 0 8px}.rei .n{font-size:38px;font-weight:800;letter-spacing:-1.2px;line-height:1}.rei .l{font-size:13px;opacity:.85}
.capa ul{padding-left:18px;margin:10px 0 0}.capa li{font-size:14px;line-height:1.45;margin-bottom:6px;opacity:.95}
.fd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fd>div{background:var(--surf2);border-radius:14px;padding:10px;text-align:center}.fd small{display:block;font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase}.fd b{display:block;font-size:16px;margin-top:2px}.fd em{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:2px}.fd .fe{color:var(--c);font-weight:800}
.nt{font-size:12.5px;color:var(--mut);line-height:1.45;margin-top:8px}
svg text{font-family:inherit}
.chart{width:100%;height:auto;display:block}
.info{width:26px;height:26px;border-radius:50%;background:var(--surf2);color:var(--mut);font-weight:700;font-size:13px;flex:0 0 26px;display:inline-flex;align-items:center;justify-content:center}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surf) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;border-radius:14px;font-size:11px;font-weight:600;color:var(--mut);min-height:52px;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--navy);background:var(--surf2)}
:root[data-theme=dark] nav.tabs button.on{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) nav.tabs button.on{color:var(--gold)}}
nav.tabs .bd{position:absolute;top:3px;right:calc(50% - 20px);min-width:17px;height:17px;border-radius:9px;background:var(--c);color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:800}
/* gaveta */
#ov{position:fixed;inset:0;background:rgba(5,12,22,.55);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#ov.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surf);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease;max-width:560px;margin:0 auto}
#sheet.on{transform:none}
#sheet .gr{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
#sheet h4{font-size:18px;margin-bottom:8px}#sheet p{font-size:14.5px;color:var(--mut);margin-bottom:9px;line-height:1.5}#sheet p b{color:var(--ink)}
#sheet ul{padding-left:18px;font-size:14px;color:var(--mut);line-height:1.5}#sheet li{margin-bottom:6px}
.foot{text-align:center;color:var(--mut);font-size:12px;margin:22px 0 6px}.foot img{height:26px;display:block;margin:0 auto 8px;border-radius:5px;opacity:.9}
.foot button{color:var(--blue);font-weight:700;font-size:13px;padding:8px}
@media (min-width:600px){body{background:linear-gradient(var(--bg),var(--bg))}#app{box-shadow:0 0 0 1px var(--line)}}
@media (max-width:360px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.kt{flex-basis:138px}}
@media print{nav.tabs,.ib{display:none}}
@media (prefers-reduced-motion:reduce){#sheet,#ov{transition:none}}

/* ================= EDICOES DE SETOR (quarta: acougue e producao; sexta: FLV) ================= */
function sVar(v, a) { return ok(v) && ok(a) && a ? (v / a - 1) : null; }
function sTiles(d, perdaRotulo) {
  const m = d.semana, a = d.ant;
  return '<div class="grid2">' + tile('Venda da semana', BRL(m.venda), NUM(m.kg) + ' kg - semana ant. ' + BRL(a.venda) + (ok(sVar(m.venda, a.venda)) ? ' (' + VAR(sVar(m.venda, a.venda)) + ')' : '')) +
    tile('Margem', '<span class="' + (d.f_mg ? 't-' + d.f_mg : '') + '">' + PCT(m.mg, 1) + '</span>', 'meta da secao ' + PCT(d.meta_mg, 1) + ' - ant. ' + PCT(a.mg, 1)) + '</div>';
}
function sTop(d) {
  return '<h3 style="margin-top:12px">Mais vendidos da semana</h3>' + itens(d.top, z => '<div class="it"><span><b>' + esc(z[0]) + '</b><small>' + NUM(z[2]) + ' kg/un - margem ' + PCT(z[3], 0) + '</small></span><span class="v">' + BRL(z[1]) + '</span></div>');
}
function sBaixa(d) {
  if (!d.margem_baixa.length) return '';
  return '<h3 style="margin-top:12px">Margem baixa <small>' + d.n_margem_baixa + ' itens abaixo da meta</small></h3>' + itens(d.margem_baixa, z => '<div class="it"><span><b>' + esc(z[0]) + '</b><small>venda ' + BRL(z[1]) + '</small></span><span class="v ' + (z[2] < 0.1 ? 't-c' : 't-a') + '">' + PCT(z[2], 0) + '</span></div>');
}
function sPerdasItens(d) {
  if (!d.perdas_itens.length) return '';
  return '<h3 style="margin-top:12px">Maiores perdas lancadas</h3>' + itens(d.perdas_itens, z => '<div class="it"><b>' + esc(z[0]) + '</b><span class="v">' + BRL(z[1]) + '<small>' + NUM(z[2], 1) + ' kg/un</small></span></div>');
}
function sDias(d) {
  const DN = ['seg', 'ter', 'qua', 'qui', 'sex', 'sab', 'dom'];
  return '<h3 style="margin-top:12px">Venda por dia</h3>' + barras(d.dias.map(z => DN[z[2]]), [{nome: 'Venda do dia', v: d.dias.map(z => z[1]), cor: 'var(--blue)'}], {h: 150});
}
function agRodape() {
  const a = M.ag.ed, todas = [].concat(['seg', 'ter', 'qua', 'qui', 'sex'].reduce((r, k) => r.concat(((a[k] && a[k].decisoes) || []).map(d => [a[k].nome, d])), []));

  return '<h2 class="st">Decisoes da semana</h2><div class="pg">' + (todas.length ? todas.map(z => '<div class="dec ' + z[1].sev + '"><b>' + esc(z[1].tit) + '</b><p>' + esc(z[1].txt) + '</p><div class="w"><span><em>Edicao: </em>' + z[0] + '</span><span><em>Dono sugerido: </em>' + esc(z[1].dono) + '</span><span><em>Ate: </em>' + DM(z[1].prazo) + '</span></div></div>').join('') : '<div class="card">Sem decisoes abertas.</div>') + '</div>' +
    '<h2 class="st">Plano de acao</h2><div class="card"><h3>Acoes atrasadas <small>' + pl.n_atr + ' no total</small></h3>' + itens(pl.atrasadas, z => '<div class="it"><span><b>' + esc(z.id) + ' - ' + esc(z.quem) + '</b><small>' + esc(z.o_que) + '</small></span><span class="v t-c">' + DM(z.prazo) + '</span></div>') + '</div>';

    '<p class="nt">Aderencia acima de 100% indica venda de estoque ou producao sem apontamento: conferir o registro da producao.</p>' +
    (pr.mix.length ? '<h3 style="margin-top:12px">Mais produzidos no mes <small>a custo</small></h3>' + itens(pr.mix, z => '<div class="it"><b>' + esc(z[0]) + '</b><span class="v">' + BRL(z[1]) + '</span></div>') : '') + sTop(pro) + sBaixa(pro) + sPerdasItens(pro) + sDias(pro) + '</div>';

function pgAgenda() {

function pgAreas() {
  if (!S.area) {
    return '<div class="com"><div class="hd"><b>Areas de gestao</b></div><p>As 8 paginas completas da visao do CEO. Escolha uma area para ver o detalhe.</p></div><div class="pg" style="margin-top:12px">' +
      LEG.pag.map(p => '<button class="arm" data-area="' + p[0] + '"><span class="n">' + p[0] + '</span><span><b>' + p[1] + '</b><small>' + (DESC[p[0]] || '') + '</small></span><span class="go">›</span></button>').join('') + '</div>';
  }
  const p = LEG.pag[S.area - 1];
  return '<button class="bk" data-area="0">‹ Areas</button><h2 class="st" style="margin-top:4px">' + p[1] + '</h2><p class="note" style="margin:-4px 4px 10px">' + esc(LEG.sub()) + '</p>' +
    '<div class="fl"><select data-leg="mes" aria-label="Mes">' + LEG.meses().map(m => '<option value="' + m[0] + '"' + (m[0] === LEG.state.m ? ' selected' : '') + '>' + m[1] + '</option>').join('') + '</select><select data-leg="cmp" aria-label="Comparar com"><option value="aa"' + (LEG.state.cmp === 'aa' ? ' selected' : '') + '>vs ano anterior</option><option value="ma"' + (LEG.state.cmp === 'ma' ? ' selected' : '') + '>vs mes anterior</option></select></div>' +
    '<div class="legacy">' + LEG.page(S.area) + '</div>';
}
const PAGS = {semana: pgSemana, agenda: pgAgenda, detalhe: pgDetalhe, caixa: pgCaixaTrib, areas: pgAreas};
S.tab = 'semana'; S.area = 0;
function ir(t) { S.tab = t; if (t === 'areas') S.area = 0; render(); window.scrollTo({top: 0}); }
document.addEventListener('click', e => { const a = e.target.closest('[data-area]'); if (a) { S.area = +a.dataset.area; S.tab = 'areas'; render(); window.scrollTo({top: 0}); } });
document.addEventListener('change', e => { const l = e.target.closest('[data-leg]'); if (!l) return; if (l.dataset.leg === 'mes') LEG.state.m = l.value; else LEG.state.cmp = l.value; render(); });
function render() {
  $('#pg').innerHTML = PAGS[S.tab]();
  $('#tabsIn').innerHTML = TABS.map(t => '<button data-go="' + t[0] + '" class="' + (S.tab === t[0] ? 'on' : '') + '" aria-label="' + t[1] + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + ICO[t[0]] + '</svg>' + t[1] + '</button>').join('');
  const g = M.gerado_em || '';
  $('#hS').textContent = 'Dados de ' + DM(M.ref) + ' - v' + M.versao + ' gerada em ' + g.slice(8, 10) + '/' + g.slice(5, 7) + '/' + g.slice(0, 4) + ' ' + g.slice(11, 16);
  $('#hT').textContent = S.tab === 'semana' ? 'MEX-FATIMA' : S.tab === 'agenda' ? 'Agenda da semana' : S.tab === 'detalhe' ? 'Vendas e causas' : S.tab === 'caixa' ? 'Caixa e tributos' : 'Areas de gestao';
  document.title = 'MEX-FATIMA - METODEX';
  if (!$('#rodape')) { const f = document.createElement('div'); f.id = 'rodape'; $('main').appendChild(f); }
  $('#rodape').innerHTML = '<div class="foot"><img src="' + LM + '" alt="METODEX">MEX-FATIMA v' + esc(M.versao) + ' - gerado em ' + esc(M.gerado_em ? M.gerado_em.slice(8, 10) + '/' + M.gerado_em.slice(5, 7) + '/' + M.gerado_em.slice(0, 4) + ' ' + M.gerado_em.slice(11, 16) : '-') + '<br>METODEX<br><button data-info="qual">Qualidade dos dados</button> <button data-info="sig">Siglas</button></div>';
}
function tema(v) { try { localStorage.setItem('tema3', v); } catch (e) {} if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = v; }
function lerTema() { try { return localStorage.getItem('tema3') || 'auto'; } catch (e) { return 'auto'; } }
function aparencia() {
  const t = lerTema(); const b = (v, n) => '<button data-tema="' + v + '" class="' + (t === v ? 'on' : '') + '">' + n + '</button>';
  gaveta('Aparencia', '<p>Escolha como o painel aparece. A escolha fica guardada neste aparelho.</p><div class="opt">' + b('auto', 'Automatico') + b('light', 'Claro') + b('dark', 'Escuro') + '</div><p class="note">Automatico segue o modo do seu celular.</p>');
}
document.addEventListener('click', e => { const b = e.target.closest('[data-tema]'); if (b) { tema(b.dataset.tema); aparencia(); } });
function iniciar() {
  LEG.init(M.leg);
  INFO.qual = ['Qualidade dos dados', '<ul>' + M.qualidade.map(q => '<li>' + esc(q) + '</li>').join('') + '<li>Areas de gestao: dados do Painel Unico; a DRE e a gerencial do ultimo mes fechado (nao a fiscal). Cartoes sem responsavel definido ficam ocultos.</li></ul><p>Fontes: ' + Object.keys(M.fontes).filter(k => M.fontes[k]).slice(0, 8).map(k => esc(k) + ' ' + esc(String(M.fontes[k]).slice(0, 10))).join(' - ') + '.</p>'];
  INFO.sig = ['Siglas e selos', '<ul>' + LEG.siglas.map(s => '<li><b>' + esc(s[0]) + ':</b> ' + esc(s[1]) + '</li>').join('') + '</ul>'];
  tema(lerTema());
  $('#bTema').addEventListener('click', aparencia);
  render();
  $('#bInstalar').onclick = instalar; $('#bInstFechar').onclick = () => { try { localStorage.setItem('instFechado', '1'); } catch (e) {} instBar(); };
  instBar(); offBar();
}
/* ---------- instalacao do app (PWA) ---------- */
let DIP = null; window.__bip = false;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); DIP = e; window.__bip = true; instBar(); });
window.addEventListener('appinstalled', () => { DIP = null; const b = document.getElementById('instBar'); if (b) b.hidden = true; });
const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const eIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
function instFechado() { try { return localStorage.getItem('instFechado') === '1'; } catch (e) { return false; } }
function instBar() { const b = document.getElementById('instBar'); if (!b) return; b.hidden = !(location.protocol === 'https:' && !standalone() && !instFechado() && !document.getElementById('app').hidden); }
function comoInstalar() {
  gaveta('Instalar o MEX-FATIMA', eIOS()
    ? '<p>No iPhone, abra este link no <b>Safari</b> e toque em:</p><ul><li><b>Compartilhar</b> (quadrado com seta para cima)</li><li><b>Adicionar a Tela de Inicio</b></li><li><b>Adicionar</b></li></ul><p class="note">O icone MEX-FATIMA aparece na tela inicial.</p>'
    : '<p>No Android, abra este link no <b>Chrome</b> e toque em:</p><ul><li>Menu <b>⋮</b> (tres pontinhos)</li><li><b>Instalar app</b> (ou <b>Adicionar a tela inicial</b>)</li><li><b>Instalar</b></li></ul><p class="note">O icone MEX-FATIMA aparece na tela inicial e o app abre em tela cheia.</p>');
}
async function instalar() { if (DIP) { DIP.prompt(); try { await DIP.userChoice; } catch (e) {} DIP = null; instBar(); } else comoInstalar(); }
function offBar() { const o = document.getElementById('offBar'); if (!o) return; const g = (typeof M !== 'undefined' && M && M.gerado_em) ? M.gerado_em : ''; o.textContent = 'Sem internet: mostrando os dados de ' + (g ? g.slice(8, 10) + '/' + g.slice(5, 7) + '/' + g.slice(0, 4) + ' ' + g.slice(11, 16) : 'ultima abertura') + '.'; o.hidden = navigator.onLine !== false; }
window.addEventListener('online', offBar); window.addEventListener('offline', offBar);
if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
if (CLARO) { M = CLARO; entrar(); }
</script>
</body>
</html>
